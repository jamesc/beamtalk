# Single source of truth for the OTP support window (ADR 0125 §3.1).
#
# Supported = max(27, current_major - 1) .. current_major. When a new OTP
# major ships, bump max-major (and drop min-major only once the old major is
# no longer worth testing) — nothing else in the repo hardcodes an OTP
# version; every consumer (`beamtalk doctor`, `beamtalk build`/`release`, the
# CI matrix) reads this file. See crates/beamtalk-cli/src/otp_support.rs.
min-major = 27
max-major = 28
