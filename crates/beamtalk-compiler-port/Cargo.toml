[package]
name = "beamtalk-compiler-port"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OTP Port binary for the Beamtalk compiler (ADR 0022)"
readme = "README.md"
keywords = ["compiler", "beam", "smalltalk", "erlang"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "beamtalk-compiler-port"
path = "src/main.rs"

[dependencies]
beamtalk-core = { workspace = true }
# why: ADR 0117 step 5 (BT-3361) — the compiler-port protocol's `queries`
# commands (diagnostics, completions, senders/sends/announce-sites/
# references/field-accesses/ffi-sites queries, selector rename) moved out of
# `beamtalk-core` into their own crate.
beamtalk-language-service = { workspace = true }
# why: BT-3340 (ADR 0117 Decision step 2) — REPL/test expression generation
# moved out of `beamtalk-core::erlang`'s re-export into a standalone crate.
beamtalk-repl = { workspace = true }
# why: shared ETF packet framing and term helpers for OTP port protocol
beamtalk-etf = { workspace = true }
# why: load_type_cache_registry (BT-2891) takes a Utf8Path for _build/type_cache/
camino = { workspace = true }
# why: encode/decode Erlang External Term Format for compiler port protocol
eetf = "0.12"
# why: EcoString is the string type used by ClassInfo/MethodInfo in beamtalk-core
ecow = { workspace = true }
# why: CLI argument parsing for -v/--verbose flag
clap = { workspace = true }
# why: structured logging for compiler port diagnostics
tracing = { workspace = true }
# why: tracing output formatting and env-filter for verbosity control
tracing-subscriber = { workspace = true }

[dev-dependencies]
# why: property-based testing for compiler port robustness (ADR 0011 Phase 4)
proptest = { workspace = true }
# why: BT-3100 — reuse beamtalk-core's shared `arb_declared_type` property-test
# generator (test_helpers::test_support) instead of duplicating it.
beamtalk-core = { workspace = true, features = ["test"] }
# why: isolated beamtalk.toml fixtures for load_diagnostics_overrides_from tests (BT-2839)
tempfile = "3.14"
# why: parse the shared compiler-port command-vocabulary conformance corpus (BT-3095)
serde_json = { workspace = true }

[build-dependencies]
beamtalk-build.workspace = true

[lints]
workspace = true
