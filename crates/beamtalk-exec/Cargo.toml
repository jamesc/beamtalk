[package]
name = "beamtalk-exec"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OTP Port binary for subprocess management (ADR 0051)"
readme = "README.md"
keywords = ["subprocess", "beam", "smalltalk", "erlang"]
categories = ["development-tools"]

[[bin]]
name = "beamtalk-exec"
path = "src/main.rs"

[dependencies]
# why: shared ETF packet framing and term helpers for OTP port protocol
beamtalk-etf = { workspace = true }
# why: encode/decode Erlang External Term Format for exec port protocol
eetf.workspace = true
# why: CLI argument parsing for -v/--verbose flag
clap = { workspace = true }
# why: structured logging for exec port diagnostics
tracing = { workspace = true }
# why: tracing output formatting and env-filter for verbosity control
tracing-subscriber = { workspace = true }
# why: process group management (setsid, kill) on Unix
libc = { workspace = true }
# why: BT-5195 — shared Job Object, kill escalation and exit-code helpers
beamtalk-process = { workspace = true }

[dev-dependencies]
# why: BT-5028 — tests that spawn children are serialised against the one that
# temporarily ignores SIGTERM process-wide, so none inherits that disposition.
serial_test.workspace = true

[build-dependencies]
beamtalk-build.workspace = true

[lints]
workspace = true
