[package]
name = "beamtalk-workspace"
description = "Shared workspace ID generation and file I/O for beamtalk tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["beam", "smalltalk", "workspace"]
categories = ["development-tools"]

[lib]
name = "beamtalk_workspace"
path = "src/lib.rs"

[dependencies]
# why: shared leaf for ~/.beamtalk resolution (see docs/development/architecture-principles.md §6)
beamtalk-env.workspace = true
# why: BT-5195 — the shared terminate-then-kill escalation in kill_process
beamtalk-process.workspace = true
miette.workspace = true
sha2.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# why: pid_liveness::is_process_alive uses kill(2) on Unix
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# why: pid_liveness uses OpenProcess/GetExitCodeProcess/GetProcessTimes on Windows
windows-sys.workspace = true

[dev-dependencies]
sha2.workspace = true
# why: parse the shared Rust/Erlang conformance fixture (tests/beamtalk_root_dir_conformance.rs)
serde_json.workspace = true
# why: scratch workspaces roots for the port-file nonce scan tests
tempfile.workspace = true
# why: serialise the test_cwd guard's own tests on the process-global cwd
serial_test.workspace = true

[lints]
workspace = true
