[package]
name = "beamtalk-desktop-broker"
description = "Desktop attach connection-broker core: discovery, spawn, readiness, reaping (ADR 0097)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["beam", "smalltalk", "desktop"]
categories = ["development-tools"]

[lib]
name = "beamtalk_desktop_broker"
path = "src/lib.rs"

[features]
# Test-only constructors for downstream crates' tests (the desktop app's
# `quit` test wraps a plain child as a tracked front). Never enabled by a
# release build: the desktop app turns it on in `[dev-dependencies]` only.
test-support = []

[dependencies]
beamtalk-workspace.workspace = true
# why: BT-5033 — the broker refuses a workspace whose protocol version differs
# from `handshake::PROTOCOL_VERSION`, the same constant the REPL, MCP and LSP
# lock on (and that a test pins to the runtime's `?PROTOCOL_VERSION`), rather
# than a second copy of the number.
beamtalk-repl-protocol.workspace = true
dirs.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Ephemeral per-boot SECRET_KEY_BASE generation (BT-2988) — on Unix this is
# `bin/server`'s job (openssl rand/urandom); Windows has no such launcher
# script, so the broker generates it itself before invoking bin\bt_attach.bat.
rand.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
# why: BT-4382 — shared `closed_port()` test helper (no async deps). The
# dependency itself is a normal one (see above); this adds the test feature.
beamtalk-repl-protocol = { workspace = true, features = ["test-ports"] }

[lints]
workspace = true
