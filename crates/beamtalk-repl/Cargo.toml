[package]
name = "beamtalk-repl"
description = "REPL-specific Core Erlang code generation (workspace bindings, trace mode)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compiler", "beam", "smalltalk", "repl"]
categories = ["compilers", "development-tools"]

[dependencies]
# why: BT-3340 (ADR 0117 Decision step 2) — REPL codegen delegates
# expression compilation and state threading to `CoreErlangGenerator`
# (`codegen::core_erlang`).
beamtalk-core.workspace = true
# why: shared leaf for the Core Erlang Document/leaf/docvec! pretty-printing
# API (BT-3343, ADR 0117 step 4) — REPL module assembly builds `Document`
# values directly rather than only through `CoreErlangGenerator`.
beamtalk-cerl-doc.workspace = true

[dev-dependencies]
ecow.workspace = true
# why: BT-3344 (ADR 0117 Decision step 4) — property tests for
# `codegen::generate_repl_expression`, moved here from
# `beamtalk-core/tests/codegen_property_tests.rs`.
proptest.workspace = true
# why: BT-3344 code review — the moved property tests need
# `beamtalk_core::test_helpers::test_support::{near_valid_beamtalk,
# proptest_config_default}`, shared rather than duplicated locally (the "No
# duplicate implementations" rule), the same `test`-feature mechanism
# `beamtalk-compiler-port` already uses for `test_support::arb_declared_type`
# (BT-3100). This is a *second*, feature-qualified requirement on top of the
# plain `beamtalk-core.workspace = true` production dependency above; Cargo
# unifies them into one built instance with `test` enabled only for dev/test
# builds of this crate, never for its production library.
beamtalk-core = { workspace = true, features = ["test"] }

[lints]
workspace = true
