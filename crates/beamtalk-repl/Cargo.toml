[package]
name = "beamtalk-repl"
description = "REPL-specific Core Erlang code generation (workspace bindings, trace mode)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compiler", "beam", "smalltalk", "repl"]
categories = ["compilers", "development-tools"]

[dependencies]
# why: BT-3340 (ADR 0117 Decision step 2) — REPL codegen delegates
# expression compilation and state threading to `CoreErlangGenerator`
# (`codegen::core_erlang`).
beamtalk-core.workspace = true
# why: shared leaf for the Core Erlang Document/leaf/docvec! pretty-printing
# API (BT-3343, ADR 0117 step 4) — REPL module assembly builds `Document`
# values directly rather than only through `CoreErlangGenerator`.
beamtalk-cerl-doc.workspace = true

[dev-dependencies]
ecow.workspace = true

[lints]
workspace = true
