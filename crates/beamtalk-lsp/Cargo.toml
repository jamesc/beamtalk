[package]
name = "beamtalk-lsp"
description = "Language Server Protocol server for the Beamtalk programming language"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["lsp", "beam", "smalltalk", "erlang"]
categories = ["development-tools"]
readme = "README.md"

[[bin]]
name = "beamtalk-lsp"
path = "src/main.rs"

[dependencies]
beamtalk-core = { workspace = true, features = ["serde"] }
# why: BT-3340 (ADR 0117 Decision step 2) — `project` (root discovery) moved
# out of `beamtalk-core` into a standalone crate.
beamtalk-project.workspace = true
beamtalk-repl-protocol = { workspace = true }
beamtalk-workspace = { workspace = true }
tower-lsp = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
camino = { workspace = true }
ecow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt", "macros"] }
tempfile = "3.14"
# Drives a raw `initialize` JSON-RPC request through `LspService`'s
# `tower::Service` impl in tests, so `Client::send_notification` (gated on
# `ServerState::Initialized`) actually sends instead of silently no-opping —
# see `apply_rename_class_move_sends_document_moved_notification` (BT-3285).
# Already pinned via `tower-lsp`'s own dependency tree (Cargo.lock), so this
# adds no new resolved version.
tower = { version = "0.4", default-features = false }

[lints]
workspace = true
