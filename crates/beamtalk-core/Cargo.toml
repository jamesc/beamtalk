[package]
name = "beamtalk-core"
description = "Beamtalk compiler core: lexer, parser, AST, type checking, and code generation"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compiler", "beam", "smalltalk", "erlang"]
categories = ["compilers", "development-tools"]

[dependencies]
ecow.workspace = true
camino.workspace = true
thiserror.workspace = true
miette.workspace = true
stacker.workspace = true
dirs.workspace = true
# why: shared leaf for ~/.beamtalk resolution (see docs/development/architecture-principles.md §6)
beamtalk-home.workspace = true
# why: shared leaf for the Core Erlang Document/leaf/docvec! pretty-printing
# API (ADR 0089), so `codegen` and `unparse` depend on it directly instead of
# `unparse` depending on `codegen` for it (see
# docs/development/architecture-principles.md §6, ADR 0117 step 4).
beamtalk-cerl-doc.workspace = true
# why: BT-2859 — no longer optional: `ffi_type_specs`'s on-disk spec cache
# (ADR 0075) unconditionally derives Serialize/Deserialize on its cache-entry
# type. The `serde` *feature* below still independently gates the optional
# derives on `ClassInfo` et al.
serde.workspace = true
# why: ADR 0100 Rule 3 (BT-2800) — parse `beamtalk.toml`'s `[diagnostics]`
# severity-override table here so both `beamtalk-cli` and `beamtalk-lsp` can
# apply it without `beamtalk-lsp` depending on `beamtalk-cli`.
toml.workspace = true
# why: BT-2859 — `ffi_type_specs`'s on-disk spec cache (ADR 0075) serialises
# cache entries as JSON, the same format `beamtalk-cli`/`beamtalk-lsp` both
# read/write.
serde_json.workspace = true
# why: BT-2859 — `ffi_type_specs` logs spec-extraction progress/failures
# (non-fatal by design), matching the tracing usage already established in
# `beamtalk-cli`/`beamtalk-lsp`.
tracing.workspace = true
# why: BT-3100 — `test_support::arb_declared_type` (the shared proptest
# generator for type-string fidelity tests) needs proptest in the normal
# dependency graph, not just dev-dependencies, so it compiles for dependent
# crates that opt in via the `test` feature below. Optional: stays out of
# the default (production) build.
proptest = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
criterion.workspace = true
tempfile = "3.14"
# why: BT-3344 — this crate's own `tests/codegen_property_tests.rs`
# integration test shares `test_helpers::test_support::near_valid_beamtalk`/
# `proptest_config_default` with `beamtalk-repl`'s copy of the same
# properties rather than duplicating them (the "No duplicate
# implementations" rule); `test_support` is gated behind the `test` feature,
# same mechanism `beamtalk-compiler-port`/`fuzz` already use to reach
# `test_support::arb_declared_type` (BT-3100). Cargo resolves `path = "."`
# as this same package instance, not a second copy, so this doesn't
# reintroduce the "multiple different versions of crate `beamtalk_core`"
# problem a real cross-crate cycle would cause.
beamtalk-core = { path = ".", features = ["test"] }
# why: already present transitively (see Cargo.lock); used in codegen tests to
# assert on Core Erlang shape without hardcoding fresh-variable counter values.
regex = "1"
# why: BT-2859 — serialises env-var-mutating tests in `ffi_type_specs`
# (mirrors the same pattern in `beamtalk-cli`).
serial_test = "4"

[[bench]]
name = "compiler_pipeline"
harness = false

[build-dependencies]
# why: BT-2859 — emits BEAMTALK_SPEC_MAPPING_STAMP for `ffi_type_specs`'s
# cache invalidation (moved here from `beamtalk-cli`'s build.rs).
beamtalk-build.workspace = true

[features]
default = []
## Expose `test_helpers::test_support` for use in dependent crates' dev-dependencies.
## Add `beamtalk-core = { features = ["test"] }` to the dependent crate's
## `[dev-dependencies]` section to enable this.
test = ["dep:proptest"]
## Enable serde Serialize/Deserialize derives on ClassInfo and related types.
## Used by beamtalk-cli to persist Pass 1 metadata cache for incremental builds.
serde = ["ecow/serde"]

[lints]
workspace = true
