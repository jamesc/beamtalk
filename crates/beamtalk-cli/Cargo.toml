[package]
name = "beamtalk-cli"
description = "Beamtalk compiler command-line interface"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compiler", "beam", "smalltalk", "erlang"]
categories = ["compilers", "development-tools"]

[lib]
name = "beamtalk_cli"
path = "src/lib.rs"

[[bin]]
name = "beamtalk"
path = "src/main.rs"

[dependencies]
beamtalk-core = { workspace = true, features = ["serde"] }
# why: ADR 0117 step 5 (BT-3361) — `diagnostic_provider` (the unified
# diagnostic pipeline `beamtalk build`/`beamtalk lint` both drive) and
# `STDLIB_PACKAGE_MARKER` moved out of `beamtalk-core` into their own crate.
beamtalk-language-service.workspace = true
# why: ADR 0117 step 5 (BT-3362) — `beamtalk build`/`beamtalk test` drive
# Core Erlang generation directly (`beam_compiler`, `build_stdlib`, `test`,
# `test_stdlib`), so this crate needs the now-standalone codegen crate.
beamtalk-codegen.workspace = true
# why: BT-3340 (ADR 0117 Decision step 2) — `lint`/`project`/`repl` moved
# out of `beamtalk-core` into standalone crates.
beamtalk-lint.workspace = true
beamtalk-project.workspace = true
beamtalk-repl.workspace = true
beamtalk-repl-protocol.workspace = true
beamtalk-workspace.workspace = true
# why: BT-3117 -- test_metamorphic's AST name-renaming transform keys its
# rename map by beamtalk-core's identifier name type (EcoString) directly,
# rather than converting to/from String at every AST field.
ecow.workspace = true
clap.workspace = true
camino.workspace = true
miette.workspace = true
thiserror.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ctrlc.workspace = true
libc.workspace = true
# why: non-destructive SIGINT registration for Ctrl-C during eval (BT-666)
signal-hook.workspace = true
rustyline.workspace = true
rand.workspace = true
base64.workspace = true
fs2.workspace = true
# why: hash registry URLs into shared-cache directory names (BT-2996)
sha2.workspace = true
# why: render markdown doc comments and README to HTML (replaces hand-rolled renderer)
pulldown-cmark.workspace = true
# why: temporary files for REPL evaluation and workspace management
tempfile = "3.14"
# why: WebSocket client for REPL protocol (ADR 0020)
tungstenite.workspace = true
# why: unified diff output for beamtalk fmt-check (BT-978)
similar.workspace = true

[target.'cfg(windows)'.dependencies]
# why: native process kill and liveness checks on Windows (BT-1039)
windows-sys.workspace = true

[dev-dependencies]
serial_test = "4"
criterion.workspace = true
# why: subprocess testing for the `beamtalk` CLI binary (BT-2084)
assert_cmd = "2"
predicates = "3"

[[bench]]
name = "build_bench"
harness = false

[build-dependencies]
beamtalk-build.workspace = true

[lints]
workspace = true
