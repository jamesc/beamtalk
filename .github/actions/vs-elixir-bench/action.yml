#
# Build beamtalk and run the nightly vs-elixir rows once (BT-4844, BT-4853).
# Shared by the first measurement (job vs-elixir-bench) and the confirming
# measurement on a fresh runner (job vs-elixir-confirm) in nightly.yml, so the
# two cannot drift apart. The caller checks out the repo first and then reads
# bench-out/results.json and bench-out/report.md.
name: vs-elixir bench run
description: Install the toolchains and run the nightly vs-elixir rows once.
inputs:
  rows:
    description: Comma-separated row ids (BENCH_ROWS)
    required: true
  rounds:
    description: Rounds per row (BENCH_ROUNDS)
    required: true
  github-token:
    description: Token for erlef/setup-beam
    required: true
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      # The channel comes from rust-toolchain.toml, as in setup-beamtalk (BT-5137).
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    # Erlang, Elixir and rebar3 all come from .tool-versions (the bench
    # compares against the Elixir the repo pins).
    - name: Install Erlang/OTP and Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        version-file: .tool-versions
        version-type: strict
        github-token: ${{ inputs.github-token }}

    - name: Install Just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        key: profile-${{ hashFiles('Cargo.toml') }}

    - name: Cache Erlang/rebar3 artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: |
          ~/.cache/rebar3
          runtime/_build
          ~/.rebar3
        key: nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**') }}
        restore-keys: |
          nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

    - name: Install beamtalk into dist/
      shell: bash
      run: just install dist

    - name: Install Hex and Rebar for the Elixir side
      shell: bash
      run: mix local.hex --force && mix local.rebar --force

    - name: Run the actor rows
      shell: bash
      env:
        BENCH_ROWS: ${{ inputs.rows }}
        BENCH_ROUNDS: ${{ inputs.rounds }}
      run: |
        mkdir -p bench-out
        benchmarks/vs-elixir/run.sh bench "$BENCH_ROUNDS" "$BENCH_ROWS" | tee bench-out/report.md
        python3 scripts/ci/vs_elixir_nightly.py parse bench-out/report.md \
          --out bench-out/results.json --expect ${BENCH_ROWS//,/ } \
          --meta "sha=$(git rev-parse --short HEAD)" "date=$(date -u +%Y-%m-%d)" "ref=$GITHUB_REF_NAME"
