# Desktop app (Tauri) crate tests (BT-3061): toolchain, cache, Linux Tauri
# prerequisites and `just test-desktop`. Shared by ci.yml's `test-desktop`
# (ubuntu, PRs touching the desktop paths) and ci-platforms.yml's
# `platform-desktop` (all three OSes). The caller checks the repo out first.

name: Test desktop app crate
description: Install the toolchain and run just test-desktop

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable

    - name: Install Just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Cache Rust dependencies (desktop/src-tauri)
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: desktop/src-tauri -> target

    # Tauri v2's documented Debian/Ubuntu prerequisites
    # (https://v2.tauri.app/start/prerequisites/) -- same list
    # desktop-release.yml installs before its own `cargo tauri build`,
    # minus `patchelf` (only needed for that lane's AppImage bundling
    # step, not for compiling/testing this crate).
    - name: Install Linux Tauri prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Test beamtalk-desktop (Tauri app crate)
      shell: bash
      run: just test-desktop
