# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    # `beamtalk-lsp`'s dev-dependency on `tower` exists only to reuse the
    # exact `tower` version already pinned transitively by `tower-lsp`
    # (0.20.0 depends on `tower ^0.4`) so its `ServiceExt` impls apply to
    # `tower_lsp::LspService` in tests. A `tower` bump that `tower-lsp`
    # hasn't followed resolves a second, incompatible `tower` major version
    # and breaks that trait resolution — see PR #3627. Ignore it until
    # `tower-lsp` itself moves past `tower 0.4`.
    ignore:
      - dependency-name: "tower"
        versions: [">=0.5.0"]
    # Group Rust updates by type
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
