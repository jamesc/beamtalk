# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    # `beamtalk-lsp`'s dev-dependency on `tower` exists only to reuse the
    # exact `tower` version already pinned transitively by `tower-lsp`
    # (0.20.0 depends on `tower ^0.4`) so its `ServiceExt` impls apply to
    # `tower_lsp::LspService` in tests. A `tower` bump that `tower-lsp`
    # hasn't followed resolves a second, incompatible `tower` major version
    # and breaks that trait resolution — see PR #3627. Ignore it until
    # `tower-lsp` itself moves past `tower 0.4`.
    ignore:
      - dependency-name: "tower"
        versions: [">=0.5.0"]
    # Group Rust updates by type
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Cargo projects outside the root workspace (BT-5087): the `/` entry above does not see their Cargo.lock files.
  - package-ecosystem: "cargo"
    directories:
      - "/desktop/src-tauri"
      - "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      rust-outside-workspace-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions: workflows live under .github/workflows (found from `/`); the composite actions under .github/actions are separate directories (BT-5087).
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/claude-triage"
      - "/.github/actions/install-nextest"
      - "/.github/actions/test-desktop"
      - "/.github/actions/vs-elixir-bench"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm: VS Code extension, GitHub Chrome extension, LiveView assets (BT-5087).
  - package-ecosystem: "npm"
    directories:
      - "/editors/vscode"
      - "/editors/github-chrome"
      - "/editors/liveview/assets"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Must match `engines.vscode` (^1.82.0); `vsce package` rejects a newer
      # types range (BT-5114).
      - dependency-name: "@types/vscode"
      # Stay on the Node major pinned in .tool-versions (22) (BT-5114).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Elixir/Mix: LiveView IDE (BT-5087).
  - package-ecosystem: "mix"
    directory: "/editors/liveview"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      elixir-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images: LiveView IDE image and the devcontainer (BT-5087).
  - package-ecosystem: "docker"
    directories:
      - "/editors/liveview"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "jamesc"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
