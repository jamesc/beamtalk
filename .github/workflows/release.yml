#
# Compiler/Runtime Release Pipeline
# ===================================
# Builds platform-specific distribution archives bundling Rust binaries and
# Erlang BEAM runtime files, then uploads them to GitHub Releases.
#
# The VS Code extension has its own pipeline (release-vscode.yml) because:
#   1. VS Code Marketplace is a different distribution channel
#   2. Extension versioning may diverge from compiler versioning
#   3. LSP-only bugfixes can ship without a full compiler release
#
# On a full release (tag push), this workflow triggers release-vscode.yml
# via workflow_call to build and publish the extension automatically.
#
# Related: release-vscode.yml (VS Code extension distribution)
# Issue: BT-717

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v0.1.0). Defaults to latest release tag.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The dtolnay action set this for every job; keep it now that rust-toolchain.toml installs the toolchain.
  CARGO_INCREMENTAL: "0"

jobs:
  # ─── Full distribution (Linux x86_64) ─────────────────────────────────
  linux-x86_64:
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/ci/determine-version.sh "$EVENT_NAME" "$RELEASE_TAG" "$INPUT_TAG"

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache: 'false'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-src-${{ hashFiles('runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}
          restore-keys: |
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Build distribution
        run: just dist

      - name: Smoke test
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh "${{ steps.version.outputs.version }}" linux-x86_64

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-${{ steps.version.outputs.version }}-linux-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── Full distribution (macOS x86_64) ──────────────────────────────────
  macos-x86_64:
    runs-on: macos-15-intel
    # The Intel runner is the slowest: the v0.5.0 release build took ~29 min
    # and the smoke test was cut off at 30. The nightly gives the same job 65.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/ci/determine-version.sh "$EVENT_NAME" "$RELEASE_TAG" "$INPUT_TAG"

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache: 'false'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-x86_64-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-src-${{ hashFiles('runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Build and install distribution
        run: just install dist

      - name: Smoke test
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh "${{ steps.version.outputs.version }}" macos-x86_64

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-${{ steps.version.outputs.version }}-macos-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── Full distribution (macOS ARM64) ──────────────────────────────────
  macos-arm64:
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/ci/determine-version.sh "$EVENT_NAME" "$RELEASE_TAG" "$INPUT_TAG"

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache: 'false'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-arm64-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-src-${{ hashFiles('runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}
          restore-keys: |
            ${{ runner.os }}-arm64-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Build and install distribution
        run: just install dist

      - name: Smoke test
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh "${{ steps.version.outputs.version }}" macos-arm64

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── Full distribution (Windows x86_64) ────────────────────────────────
  windows-x86_64:
    # Pin to 2022: erlef/setup-beam@v1 doesn't support win25 (windows-2025) yet
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/ci/determine-version.sh "$EVENT_NAME" "$RELEASE_TAG" "$INPUT_TAG"

      - name: Install Rust toolchain
        # The channel and components come from rust-toolchain.toml alone (BT-5086).
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-src-${{ hashFiles('runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}
          restore-keys: |
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-deps-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.config.script', 'runtime/rebar.lock') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Build Rust (release)
        run: cargo build --release --locked --quiet

      - name: Build Erlang runtime
        shell: bash
        run: cd runtime && rebar3 compile

      - name: Build standard library
        shell: bash
        run: |
          ./target/release/beamtalk.exe build-stdlib

      - name: Smoke test
        shell: bash
        run: |
          ./target/release/beamtalk.exe --version
          ./target/release/beamtalk.exe new smoke_project
          printf 'Object subclass: SmokeTest\n  class run => 21 + 21\n' > smoke_project/src/SmokeTest.bt
          cd smoke_project && ../target/release/beamtalk.exe run SmokeTest run
          echo "Smoke test passed"

      # package-release.sh installs target/share/ (the MCP example corpus,
      # BT-4614) into the archive, so it must be built first (BT-5077).
      - name: Build MCP example corpus
        shell: bash
        run: cargo run --release --locked --bin build-corpus --quiet

      - name: Package zip
        id: package
        shell: bash
        run: scripts/ci/package-release.sh "${{ steps.version.outputs.version }}" windows-x86_64

      # Windows verification of BT-5077's share/ data. 7z is on the runner
      # (package-release.sh uses it); the archive is extracted afresh so the
      # assertion sees exactly what a user installs.
      - name: Check archive share/ data
        shell: bash
        run: |
          rm -rf archive-check
          mkdir archive-check
          7z x -oarchive-check "${{ steps.package.outputs.archive }}" >/dev/null
          scripts/ci/check-archive-share.sh archive-check/beamtalk-*
          rm -rf archive-check

      - name: Upload release asset
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-${{ steps.version.outputs.version }}-windows-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── Notify beamtalk-uat acceptance gate (BT-2449) ──────────────────────
  # After every platform's release archive is built and uploaded, fire a
  # repository_dispatch into jamesc/beamtalk-uat so the UAT gate (BT-2253)
  # runs against this exact published version. The consumer (BT-2451) listens
  # for the event-type `beamtalk-release` and reads `version` + `tag` from the
  # client-payload.
  #
  # Guarded by `github.event_name == 'release'` — the same condition that gates
  # the real "Upload release asset" steps above — so dry-run / artifact-only
  # invocations (workflow_dispatch) no-op cleanly and never dispatch.
  notify-uat:
    needs: [linux-x86_64, macos-x86_64, macos-arm64, windows-x86_64]
    if: github.event_name == 'release'
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Re-resolve version/tag here (each build job computes these in its own
      # runner; this is a separate job, so derive them the same way).
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/ci/determine-version.sh "$EVENT_NAME" "$RELEASE_TAG" "$INPUT_TAG"

      - name: Dispatch UAT gate
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          # UAT_DISPATCH_TOKEN: a PAT / fine-grained token with
          # `contents: write` (i.e. repository_dispatch) scope on
          # jamesc/beamtalk-uat. It must be provisioned separately as a repo
          # secret in this repo's settings — it is NOT GITHUB_TOKEN, which
          # cannot dispatch across repositories.
          token: ${{ secrets.UAT_DISPATCH_TOKEN }}
          repository: jamesc/beamtalk-uat
          event-type: beamtalk-release
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "tag": "${{ steps.version.outputs.tag }}"
            }

  # ─── beamtalk-artifact dispatch (ADR 0154 § 3, BT-5306) ──────────────────
  # The payload uat verifies: every asset's sha256 and the OTP window. It waits
  # for the lanes that attach assets to the release (VS Code .vsix, LiveView IDE
  # archives, desktop installers) so `assets` is complete, but runs whether or
  # not those lanes succeed: it is gated on the four platform builds only, and a
  # failed lane just contributes no assets. The `beamtalk-release` dispatch above
  # stays until uat accepts both event types; a follow-up removes it.
  notify-uat-artifact:
    needs: [linux-x86_64, macos-x86_64, macos-arm64, windows-x86_64, vscode-extension, liveview-ide, desktop-app]
    if: >-
      ${{ !cancelled() && github.event_name == 'release'
      && needs.linux-x86_64.result == 'success' && needs.macos-x86_64.result == 'success'
      && needs.macos-arm64.result == 'success' && needs.windows-x86_64.result == 'success' }}
    # Pinned, not floating: ADR 0154 § 3.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/ci/determine-version.sh "$EVENT_NAME" "$RELEASE_TAG" "$INPUT_TAG"

      - name: Build uat dispatch payload
        id: uat
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          payload="$(scripts/ci/uat-dispatch-payload.sh release "${VERSION}" "${TAG}" "${GITHUB_SHA}")"
          echo "payload=${payload}" >> "$GITHUB_OUTPUT"

      - name: Dispatch beamtalk-artifact to uat
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.UAT_DISPATCH_TOKEN }}
          repository: jamesc/beamtalk-uat
          event-type: beamtalk-artifact
          client-payload: ${{ steps.uat.outputs.payload }}

  # ─── VS Code extension (delegated to release-vscode.yml) ────────────────
  vscode-extension:
    uses: ./.github/workflows/release-vscode.yml
    with:
      publish: ${{ github.event_name == 'release' }}
      attach_to_release: ${{ github.event_name == 'release' }}
      tag: ${{ github.event.release.tag_name }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # ─── LiveView IDE (delegated to liveview-release.yml) ────────────────────
  # Ships the IDE on its own lane (BT-2512): self-contained mix-release archives,
  # uploaded to the GitHub Release on a full release. Independent of the core
  # bundle above — the Elixir/Phoenix toolchain is never added to it.
  liveview-ide:
    uses: ./.github/workflows/liveview-release.yml
    with:
      publish: ${{ github.event_name == 'release' }}

  # ─── Desktop app (delegated to desktop-release.yml) ──────────────────────
  # Ships the Tauri desktop attach client (ADR 0097, BT-5006) on its own lane:
  # Linux/macOS/Windows installers uploaded to the GitHub Release on a full
  # release. The Apple secrets are optional — without them the macOS legs
  # build unsigned, un-notarized artifacts instead of failing.
  desktop-app:
    uses: ./.github/workflows/desktop-release.yml
    with:
      publish: ${{ github.event_name == 'release' }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
