#
# Edge Build — rolling per-merge distribution
# ===========================================
# Publishes a Linux x86_64 distribution bundle to a rolling `edge` GitHub
# pre-release on every merge to `main`. This is the artifact the beamtalk-uat
# acceptance gate consumes for its per-PR end-to-end run (BEAMTALK_UAT_VERSION=
# edge), so the gate always tests the *current* tip rather than the up-to-24h-old
# `nightly` or a stale tagged release.
#
# Scope is deliberately narrow vs nightly.yml:
#   * Linux x86_64 only — the UAT PR e2e job runs a single Linux leg. The full
#     cross-platform matrix stays in nightly.yml (daily) and release.yml (tags).
#   * No extra test matrix — every push to `main` already passed ci.yml. This
#     job only builds, smoke-tests the install, packages, and publishes.
#
# The `edge` release/tag is deleted and recreated each run, so it always points
# at the latest `main` commit. `nightly` (cross-platform, daily) and tagged
# releases are untouched.

name: Edge

on:
  push:
    branches: [main]
    # A docs-only merge doesn't change the artifact — skip the rebuild.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # Serialize edge publishes: a newer merge waits for the in-flight publish
  # instead of cancelling it; only the newest pending run is kept (older pending
  # runs are replaced). A ~15 min build must be able to finish during a burst of
  # merges, otherwise each run is cancelled by the next one and nothing publishes.
  # The release still catches up to the latest main within one extra build.
  group: edge
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Names the channel in `beamtalk --version` (BT-4812).
  BEAMTALK_BUILD_CHANNEL: edge

jobs:
  edge:
    name: Build & publish edge (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: edge-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            edge-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build distribution
        run: just dist

      - name: Smoke test install
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh edge linux-x86_64

      - name: Publish rolling edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Delete the previous edge release + tag so it always points at the
          # latest main commit (rolling). --cleanup-tag removes the git tag too.
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true

          # Publish the installer from this commit next to the tarball, with a
          # checksum, so scripts/refresh-edge.sh can verify it before running
          # it (BT-4833).
          mkdir -p dist-installer
          cp scripts/install.sh dist-installer/install.sh
          (cd dist-installer && sha256sum install.sh > install.sh.sha256)

          gh release create edge \
            --title "Edge Build (${SHORT_SHA})" \
            --notes "Rolling per-merge build from \`main\` at ${DATE}.

          **Commit:** ${SHORT_SHA}
          **Full SHA:** $(git rev-parse HEAD)

          > [!WARNING]
          > Edge builds track the development tip. They are consumed by the
          > beamtalk-uat acceptance gate and by downstream package CI via
          > \`install.sh --edge\` (linux-x86_64 only). For general use, prefer
          > a tagged release or \`--nightly\`." \
            --prerelease \
            --target "${GITHUB_SHA}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            dist-installer/install.sh \
            dist-installer/install.sh.sha256
