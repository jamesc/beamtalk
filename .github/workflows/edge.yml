#
# Edge Build — rolling per-merge distribution
# ===========================================
# Publishes a Linux x86_64 distribution bundle to a rolling `edge` GitHub
# pre-release on every merge to `main`. This is the artifact the beamtalk-uat
# acceptance gate consumes for its per-PR end-to-end run (BEAMTALK_UAT_VERSION=
# edge), so the gate always tests the *current* tip rather than the up-to-24h-old
# `nightly` or a stale tagged release.
#
# Scope is deliberately narrow vs nightly.yml:
#   * Linux x86_64 only — the UAT PR e2e job runs a single Linux leg. The full
#     cross-platform matrix stays in nightly.yml (daily) and release.yml (tags).
#   * No extra test matrix — every push to `main` already passed ci.yml. This
#     job only builds, smoke-tests the install, packages, and publishes.
#
# The `edge` release is updated in place each run (assets first, then the tag is
# moved), so it always points at the latest `main` commit and a failed publish
# leaves the previous release. `nightly` (cross-platform, daily) and tagged
# releases are untouched. Only runs on `main` publish.

name: Edge

on:
  push:
    branches: [main]
    # A docs-only merge doesn't change the artifact — skip the rebuild.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # Serialize edge publishes: a newer merge waits for the in-flight publish
  # instead of cancelling it; only the newest pending run is kept (older pending
  # runs are replaced). A ~15 min build must be able to finish during a burst of
  # merges, otherwise each run is cancelled by the next one and nothing publishes.
  # The release still catches up to the latest main within one extra build.
  group: edge
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The dtolnay action set this for every job; keep it now that rust-toolchain.toml installs the toolchain.
  CARGO_INCREMENTAL: "0"
  # Names the channel in `beamtalk --version` (BT-4812).
  BEAMTALK_BUILD_CHANNEL: edge

jobs:
  edge:
    name: Build & publish edge (linux-x86_64)
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache-save-if: 'true'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: edge-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.lock', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            edge-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build distribution
        run: just dist

      - name: Smoke test install
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh edge linux-x86_64

      # workflow_dispatch can start this from any branch; only main may become
      # `edge` (BT-5094). The build above still runs, so a branch can be timed.
      - name: Skip publishing from a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::warning::Not publishing, ${GITHUB_REF} is not refs/heads/main, so this run must not replace the edge release."

      - name: Publish rolling edge release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Publish the installer from this commit next to the tarball, with a
          # checksum, so scripts/refresh-edge.sh can verify it before running
          # it (BT-4833).
          mkdir -p dist-installer
          cp scripts/install.sh dist-installer/install.sh
          (cd dist-installer && sha256sum install.sh > install.sh.sha256)

          cat > edge-notes.md <<NOTES
          Rolling per-merge build from \`main\` at ${DATE}.

          **Commit:** ${SHORT_SHA}
          **Full SHA:** ${GITHUB_SHA}

          > [!WARNING]
          > Edge builds track the development tip. They are consumed by the
          > beamtalk-uat acceptance gate and by downstream package CI via
          > \`install.sh --edge\` (linux-x86_64 only). For general use, prefer
          > a tagged release or \`--nightly\`.
          NOTES

          # Update in place so a failed publish leaves the previous edge release
          # (scripts/ci/publish-rolling-release.sh, BT-5094).
          scripts/ci/publish-rolling-release.sh edge "${GITHUB_SHA}" \
            "Edge Build (${SHORT_SHA})" edge-notes.md \
            "${ARCHIVE}" "${ARCHIVE}.sha256" \
            dist-installer/install.sh dist-installer/install.sh.sha256

  # ─── uat dispatch (ADR 0154 § 3, BT-5306) ───────────────────────────
  # Hands uat the exact published bytes: every asset's sha256 plus the OTP window.
  # A separate job so a failed dispatch can be re-run on its own, without
  # rebuilding or re-publishing the release.
  notify-uat:
    needs: [edge]
    if: github.ref == 'refs/heads/main'
    # Pinned, not floating: ADR 0154 § 3.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build uat dispatch payload
        id: uat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          payload="$(scripts/ci/uat-dispatch-payload.sh edge \
            "$(cat VERSION)-edge+${SHORT_SHA}" edge "${GITHUB_SHA}")"
          echo "payload=${payload}" >> "$GITHUB_OUTPUT"

      - name: Dispatch beamtalk-artifact to uat
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.UAT_DISPATCH_TOKEN }}
          repository: jamesc/beamtalk-uat
          event-type: beamtalk-artifact
          client-payload: ${{ steps.uat.outputs.payload }}
