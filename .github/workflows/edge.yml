# Edge Build — rolling per-merge distribution
# ===========================================
# Publishes distribution bundles to a rolling `edge` GitHub pre-release on every
# merge to `main`, for linux-x86_64 and macos-arm64 (BT-5307, ADR 0154 § 3). This
# is the artifact the beamtalk-uat acceptance gate consumes (BEAMTALK_UAT_VERSION=
# edge), and that downstream package CI installs with `install.sh --edge`, so they
# test the *current* tip rather than the up-to-24h-old `nightly` or a tag.
#
# Scope is deliberately narrow vs nightly.yml:
#   * linux-x86_64 and macos-arm64 only. macOS is here so macOS-only regressions
#     (BT-5264) surface within the hour, not the next night. macos-x86_64 and
#     Windows stay in nightly.yml (daily) and release.yml (tags).
#   * No extra test matrix — every push to `main` already passed ci.yml. Each
#     `build` leg only builds, smoke-tests the install and packages, with the
#     same scripts/ci/package-release.sh nightly uses.
#   * Runner images are pinned (ubuntu-24.04, macos-15), not `*-latest`: uat
#     tests each target on the image that built it (ADR 0154 § 3).
#
# One commit per release, never a mix (BT-5307). The `build` legs only upload
# workflow artifacts; a single `edge` job then publishes every asset of this
# commit in one scripts/ci/publish-rolling-release.sh call. That script uploads
# all the assets first (each archive followed by its own checksum), deletes any
# asset this run does not ship, and only then moves the `edge` tag and updates
# the release title and notes. So:
#   * The release is updated last; a failed publish leaves the previous one.
#   * The linux and macOS assets of one commit are never left next to another
#     commit's. If the macOS leg fails, linux still publishes (downstream CI is
#     linux and must not go stale on a macOS flake) and the previous commit's
#     macOS asset is removed rather than kept, so `install.sh --edge` on macOS
#     fails with a download error instead of installing an older commit. The
#     run is still red, because the macOS leg failed.
#   * Runs are serialized (concurrency group `edge`), so two publishes never
#     interleave their uploads. While one publish is uploading, a client can see
#     the new archive of one target next to the old archive of the other for
#     the seconds the uploads take (GitHub has no atomic multi-asset replace);
#     each archive always matches its own `.sha256`, and uat pins the exact
#     hashes of one commit after the publish, so it never mixes them.
# A run started from a branch (workflow_dispatch) builds both legs but never
# publishes. `nightly` and tagged releases are untouched.

name: Edge

on:
  push:
    branches: [main]
    # A docs-only merge doesn't change the artifact — skip the rebuild.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # Serialize edge publishes: a newer merge waits for the in-flight publish
  # instead of cancelling it; only the newest pending run is kept (older pending
  # runs are replaced). A ~15 min build must be able to finish during a burst of
  # merges, otherwise each run is cancelled by the next one and nothing publishes.
  # The release still catches up to the latest main within one extra build.
  group: edge
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The dtolnay action set this for every job; keep it now that rust-toolchain.toml installs the toolchain.
  CARGO_INCREMENTAL: "0"
  # Names the channel in `beamtalk --version` (BT-4812).
  BEAMTALK_BUILD_CHANNEL: edge

jobs:
  build:
    name: Build edge (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Each leg publishes on its own merit: a macOS failure must not stop linux.
      fail-fast: false
      matrix:
        include:
          # The `platform:` values are the edge targets; scripts/install.sh's
          # EDGE_PLATFORMS must list the same ones (scripts/ci/test-install.sh).
          # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
          - platform: linux-x86_64
            runner: ubuntu-24.04
            timeout: 30
          # Cold Rust + OTP build; release.yml's macos-arm64 job is ~25 min.
          - platform: macos-arm64
            runner: macos-15
            timeout: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache-save-if: 'true'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: edge-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.lock', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            edge-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build distribution
        run: just dist

      - name: Smoke test install
        run: just test-install

      - name: Package tarball
        id: package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/package-release.sh edge "${PLATFORM}"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-edge-${{ matrix.platform }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  edge:
    name: Publish edge
    needs: [build]
    # Publish whenever linux built, even if macOS did not (see the header).
    # The job decides from the artifacts present, since `needs.build.result` is
    # one result for the whole matrix.
    if: ${{ !cancelled() }}
    # Pinned, not floating: ADR 0154 § 3.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the platform packages, not any other artifact of the run.
      - name: Download platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist-artifacts
          pattern: beamtalk-edge-*
          merge-multiple: true

      # The asset list: linux is required (nothing is published without it),
      # macOS is added when its leg succeeded. Each archive is followed by its
      # checksum. Anything else in the download is an error.
      - name: Assemble the asset list
        id: assets
        run: |
          set -euo pipefail
          list=()
          for plat in linux-x86_64 macos-arm64; do
            a="dist-artifacts/beamtalk-edge-${plat}.tar.gz"
            if [ -f "${a}" ] && [ -f "${a}.sha256" ]; then
              list+=("${a}" "${a}.sha256")
            elif [ "${plat}" = linux-x86_64 ]; then
              echo "::error::the linux-x86_64 build did not produce ${a}; not publishing"
              exit 1
            else
              echo "::warning::no ${plat} package (its build failed); publishing without it and removing the previous commit's ${plat} asset"
            fi
          done
          expected="$(printf '%s\n' "${list[@]##*/}" | sort)"
          actual="$(find dist-artifacts -type f -printf '%f\n' | sort)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::unexpected files in the edge packages"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
          printf '%s\n' "${list[@]}" > edge-assets.txt
          cat edge-assets.txt

      # workflow_dispatch can start this from any branch; only main may become
      # `edge` (BT-5094). The builds above still run, so a branch can be timed.
      - name: Skip publishing from a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::warning::Not publishing, ${GITHUB_REF} is not refs/heads/main, so this run must not replace the edge release."

      - name: Publish rolling edge release
        if: github.ref == 'refs/heads/main'
        # The only step that writes the `edge` release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Publish the installer from this commit next to the tarballs, with a
          # checksum, so scripts/refresh-edge.sh can verify it before running
          # it (BT-4833).
          mkdir -p dist-installer
          cp scripts/install.sh dist-installer/install.sh
          (cd dist-installer && sha256sum install.sh > install.sh.sha256)

          cat > edge-notes.md <<NOTES
          Rolling per-merge build from \`main\` at ${DATE}.

          **Commit:** ${SHORT_SHA}
          **Full SHA:** ${GITHUB_SHA}

          > [!WARNING]
          > Edge builds track the development tip. They are consumed by the
          > beamtalk-uat acceptance gate and by downstream package CI via
          > \`install.sh --edge\` (linux-x86_64 and macos-arm64). For general
          > use, prefer a tagged release or \`--nightly\`.
          NOTES

          mapfile -t ASSETS < edge-assets.txt
          # Assets first, then the tag and release (scripts/ci/publish-rolling-release.sh,
          # BT-5094; see the header for why one commit's assets never mix).
          scripts/ci/publish-rolling-release.sh edge "${GITHUB_SHA}" \
            "Edge Build (${SHORT_SHA})" edge-notes.md \
            "${ASSETS[@]}" \
            dist-installer/install.sh dist-installer/install.sh.sha256
