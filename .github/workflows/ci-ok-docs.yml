name: CI (docs-only ci-ok)

# ci.yml has workflow-level `paths:` filters, so a PR that touches only docs
# never starts it and its `ci-ok` aggregate job (the single required check,
# BT-5086) would never report: the PR would wait on "Expected" forever. This
# workflow runs on exactly the paths ci.yml ignores and reports a passing job
# with the same name, so docs-only PRs still get a `ci-ok`. A PR touching both
# kinds of path runs both workflows; each `ci-ok` must pass.
#
# `just test-ci-ok` proves the two path filters partition every tracked file
# (each file starts ci.yml or this workflow, never neither) so they cannot drift.
on:
  pull_request:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - '!docs/learning/**'
      - '!docs/beamtalk-language-features.md'
      - '!docs/repl-protocol.md'
      - '!docs/development/surface-parity.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.devcontainer/**'

permissions: {}

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Only paths that ci.yml ignores changed; nothing to run."
