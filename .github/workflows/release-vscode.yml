# VS Code Extension Release Pipeline
# ====================================
# Packages a single universal .vsix file and publishes to the VS Code Marketplace
# when the VSCE_PAT secret is set; a publish requested without it still attaches
# the .vsix to the GitHub Release, then fails the run.
#
# The extension no longer bundles a platform-specific beamtalk-lsp binary.
# Instead, it discovers beamtalk-lsp at runtime via `beamtalk --print-sysroot`,
# requiring users to have Beamtalk installed on their PATH.
#
# This workflow is separate from the compiler/runtime release (release.yml) because:
#   1. VS Code Marketplace is a different distribution channel
#   2. Extension versioning may diverge from compiler versioning
#   3. LSP-only bugfixes can ship without a full compiler release
#
# Trigger modes:
#   - workflow_call: Invoked by release.yml during a full release (publishes by default)
#   - workflow_dispatch: Manual trigger for independent extension releases
#     (e.g., LSP-only bugfix without a full compiler release)
#
# Inside a called workflow `github.event_name` is the CALLER's event, so no
# condition here may test for 'workflow_call' (BT-5094). What the job does is
# decided by its inputs: `publish` gates the whole publish job, and
# `attach_to_release` + `tag` say which GitHub Release gets the .vsix.
#
# Related: release.yml (compiler/runtime distribution)
# Issue: BT-1013

name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to VS Code Marketplace (otherwise just build .vsix artifact)'
        required: false
        type: boolean
        default: false
      attach_to_release:
        description: 'Also attach the .vsix to the GitHub Release named by `tag`'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release tag to attach the .vsix to (required with attach_to_release)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      publish:
        description: 'Publish to VS Code Marketplace'
        required: false
        type: boolean
        default: true
      attach_to_release:
        description: 'Also attach the .vsix to the GitHub Release named by `tag`'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release tag to attach the .vsix to (required with attach_to_release)'
        required: false
        type: string
        default: ''
    secrets:
      VSCE_PAT:
        required: false

concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Package universal VS Code extension ──────────────────────────────
  package-vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      vsix_name: ${{ steps.version.outputs.vsix_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .tool-versions

      - name: Get extension version
        id: version
        run: |
          VERSION=$(node -p "require('./editors/vscode/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix_name=beamtalk-vscode-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: |
          cd editors/vscode
          npm ci --quiet
          npm run bundle
          ln -sf ../../LICENSE LICENSE
          npx --no-install vsce package --out "../../beamtalk-vscode-${{ steps.version.outputs.version }}.vsix"
          rm -f LICENSE

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-vscode-${{ steps.version.outputs.version }}
          path: beamtalk-vscode-${{ steps.version.outputs.version }}.vsix
          retention-days: 7

  # ─── Publish VS Code extension to marketplace ─────────────────────────
  publish-vscode:
    needs: package-vscode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # BT-5137: either input runs the job; each step below gates on its own input,
    # so `attach_to_release` works without `publish`.
    if: inputs.publish || inputs.attach_to_release
    # Mapped at job level: a step's `if:` is evaluated before that step's own
    # `env:` is applied, so a secret mapped only on the step is always empty
    # in the condition (BT-5094).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSIX_NAME: ${{ needs.package-vscode.outputs.vsix_name }}
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: beamtalk-vscode-${{ needs.package-vscode.outputs.version }}

      - name: Upload VSIX to GitHub Release
        if: inputs.attach_to_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::attach_to_release is set but no tag was given"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$VSIX_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # This job has no other checkout; setup-node reads the Node version from
      # .tool-versions, and `vsce` is the pinned devDependency of
      # editors/vscode (BT-5137), so fetch just those files. Into a
      # subdirectory: a checkout into the workspace root would clean away the
      # .vsix downloaded above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.publish && env.VSCE_PAT != ''
        with:
          path: .node-version-src
          sparse-checkout: |
            .tool-versions
            editors/vscode/package.json
            editors/vscode/package-lock.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        if: inputs.publish && env.VSCE_PAT != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version-src/.tool-versions

      - name: Install vsce (locked)
        if: inputs.publish && env.VSCE_PAT != ''
        working-directory: .node-version-src/editors/vscode
        run: npm ci --quiet --ignore-scripts

      - name: Publish to VS Code Marketplace
        if: inputs.publish && env.VSCE_PAT != ''
        working-directory: .node-version-src/editors/vscode
        run: npx --no-install vsce publish --packagePath "$GITHUB_WORKSPACE/$VSIX_NAME"

      # A release that was asked to publish must not go green without doing so
      # (BT-5137). Last, so the .vsix is already attached to the release.
      - name: Fail when VSCE_PAT is missing
        if: inputs.publish && env.VSCE_PAT == ''
        run: |
          echo "::error::VSCE_PAT is not set: the VS Code Marketplace publish did not run (the .vsix is attached to the release). Set the secret and re-run, or dispatch with publish=false."
          exit 1
