# LiveView IDE Release Pipeline
# =============================
# Builds self-contained, ERTS-embedded `mix release` archives of the LiveView
# IDE (bt_attach). It has two halves (ADR 0154 § 10, BT-5313):
#
#   build-and-attach  (`attach` + `tag`) build every platform's archive and
#                     attach it, with its `.sha256`, to the GitHub (pre-)release
#                     named by `tag`. release.yml's tag flow runs this, so uat
#                     tests the exact archives.
#   publish           (`publish` + `tag`) the archives have no channel of their
#                     own: they reach users when promotion marks the release
#                     latest. Publishing them is therefore the last check before
#                     that, re-hashing every attached `beamtalk-ide-*` archive
#                     against its sidecar (scripts/ci/verify-release-assets.sh).
#                     Callable only from promote.yml once RELEASE_PUBLISH_MODE=
#                     promote (scripts/ci/publish-guard.sh).
#
# The IDE ships on its OWN release lane — separate from the compiler/runtime
# bundle (release.yml) and the VS Code extension (release-vscode.yml) — because:
#   1. It is a separate consumer (Attach topology, ADR 0017/0091): its own BEAM
#      node, reached over Erlang distribution; it never lives in the core bundle.
#   2. Its Elixir/Phoenix toolchain must not be forced onto every CLI install.
#   3. It can ship fixes without a full compiler release.
#
# Trigger modes (mirrors release-vscode.yml):
#   - workflow_call: release.yml (build-and-attach; interim publish) and, from
#     BT-5315, promote.yml (publish).
#   - workflow_dispatch: manual build (artifacts only unless `attach`/`publish`).
#
# Windows is out of scope: per ADR 0091 the remote IDE host is Linux/macOS;
# Windows is a browser-only client.
#
# Related: release.yml (core bundle), liveview.yml (per-PR CI)
# Issue: BT-2515 (epic BT-2512), BT-5313

name: LiveView IDE Release

on:
  workflow_dispatch:
    inputs:
      attach:
        description: 'Attach the archives to the GitHub Release named by `tag` (otherwise build artifacts only)'
        required: false
        type: boolean
        default: false
      publish:
        description: 'Publish: verify the IDE archives attached to `tag` (no build). Refused unless RELEASE_PUBLISH_MODE allows this caller.'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release tag to attach to or publish from'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (default: the caller''s ref)'
        required: false
        type: string
        default: ''
      attach:
        description: 'Attach the archives to the GitHub Release named by `tag`'
        required: false
        type: boolean
        default: false
      publish:
        description: 'Publish: verify the IDE archives attached to `tag` (no build)'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release tag to attach to or publish from'
        required: false
        type: string
        default: ''

concurrency:
  # Keyed by tag/commit too: two release.yml runs from one branch must not
  # cancel each other's lane and leave a half-attached pre-release.
  group: liveview-release-${{ inputs.tag || inputs.ref || github.ref }}-${{ inputs.publish && 'publish' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Build (and, with attach, attach to the release) ───────────────────
  build:
    name: Build IDE release (${{ matrix.platform }})
    # A publish-only call checks what is attached; it never rebuilds.
    if: ${{ !inputs.publish || inputs.attach }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write # gh release upload with attach
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not floating (ADR 0154 § 3).
          - runner: ubuntu-24.04
            platform: linux-x86_64
          # Pinned, not floating (ADR 0154 § 3).
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The IDE version tracks the repo VERSION file (BT-2514), matching the
      # version mix.exs embeds in the release — so the archive name agrees with
      # what `bin/bt_attach version` reports.
      - name: Determine version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Erlang/Elixir versions come from the repo-root .tool-versions — the
      # single source of truth shared with mise (dev machines, devcontainer),
      # so the release is built with the same toolchain CI tested.
      - name: Install Erlang/OTP + Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Node is build-only: esbuild bundles CodeMirror (BT-2538) into app.js for
      # the release. Version tracks .tool-versions.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: editors/liveview/assets/package-lock.json

      - name: Cache Mix deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            editors/liveview/deps
            editors/liveview/_build
          key: ${{ runner.os }}-${{ matrix.platform }}-liveview-rel-${{ hashFiles('editors/liveview/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-liveview-rel-

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Same recipe devs run locally (BT-2513) — single definition of the
      # release build. Produces dist-liveview/ at the repo root.
      - name: Build release
        run: just dist-liveview

      # Boot the ERTS-embedded release without binding a socket — proves the
      # archive is self-contained and the prod config provider (runtime.exs,
      # incl. OIDC fail-closed resolution) loads. A full HTTP/attach smoke needs
      # a live workspace and is covered by the workspace-gated e2e (BT-2510).
      - name: Smoke test (release boots)
        env:
          # `eval` runs the prod config provider (runtime.exs), which requires a
          # signing secret. A throwaway one suffices — we never bind a socket.
          SECRET_KEY_BASE: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          test -x dist-liveview/bin/server  # launcher overlay present + executable
          dist-liveview/bin/bt_attach version
          dist-liveview/bin/bt_attach eval 'IO.puts("boot-ok " <> to_string(Application.spec(:bt_attach, :vsn)))'

      - name: Package archive
        id: package
        run: scripts/ci/package-liveview-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.platform }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-ide-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

      # Build-and-attach: onto the (pre-)release release.yml created for the tag.
      - name: Upload to GitHub Release
        if: inputs.attach
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::attach is set but no tag was given"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${ARCHIVE}" "${ARCHIVE}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  # ─── Publish: check the attached archives before the release goes out ──
  publish:
    needs: build
    if: ${{ !cancelled() && inputs.publish && contains(fromJSON('["success","skipped"]'), needs.build.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci/publish-guard.sh
            scripts/ci/verify-release-assets.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check this caller may publish
        env:
          RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE }}
        run: scripts/ci/publish-guard.sh "LiveView IDE archive publish"

      # Three platforms: linux-x86_64, macos-arm64, macos-x86_64 (the build
      # matrix). By prefix, not VERSION: the checkout here is the caller's ref,
      # which need not be the tag.
      - name: Verify the attached IDE archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::publish is set but no tag was given"
            exit 1
          fi
          scripts/ci/verify-release-assets.sh "${RELEASE_TAG}" beamtalk-ide- 3
