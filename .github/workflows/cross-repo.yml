#
# Cross-Repo Package Tests
# =========================
# Builds the Beamtalk compiler from source and tests first-party packages
# extracted to their own repositories (starting with beamtalk-http).
#
# Catches compiler regressions that break downstream packages — these are
# invisible to the main CI since the packages live in separate repos.
#
# Runs on push to main (to catch regressions immediately) and on a nightly
# schedule (to catch issues from upstream dependency changes).
#
# Pattern: add new packages as additional jobs following the beamtalk-http
# template below.

name: Cross-Repo Packages

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.github/skills/**'
      - '.devcontainer/**'
  schedule:
    # 7am UTC daily (11pm PT, 8am CET) — offset from nightly.yml (6am) to
    # avoid resource contention
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── beamtalk-http ──────────────────────────────────────────────────
  beamtalk-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Point to the compiler repo's runtime so the freshly-installed
      # beamtalk binary uses the bundled runtime tools (including rebar3)
      # instead of whatever happens to be available on PATH.
      BEAMTALK_RUNTIME_DIR: ${{ github.workspace }}/runtime
    steps:
      - name: Checkout beamtalk compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build compiler and stdlib
        run: just build

      - name: Install compiler on PATH
        run: |
          # Make the freshly-built beamtalk binary available system-wide
          # just build produces a debug build
          sudo cp target/debug/beamtalk /usr/local/bin/beamtalk
          beamtalk --version

      - name: Checkout beamtalk-http
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: jamesc/beamtalk-http
          path: _packages/beamtalk-http

      - name: Build beamtalk-http
        working-directory: _packages/beamtalk-http
        run: beamtalk build

      # Part of the beamtalk-http suite reaches the public internet over real
      # HTTPS (HTTPTest>>testHttpsGetReturnsOkStatus), so runner network noise
      # reds this canary on its own. Two signatures seen on main, both transient:
      # a connection/TLS failure surfacing as `http_error error in 'get:headers:'
      # on Http`, and a non-2xx response surfacing as a bare assertion failure.
      #
      # Re-run the suite instead of failing on that flake — but only for that
      # flake. `beamtalk test` selects by path, not by test name, so the retry
      # can't run one method in isolation; instead the *trigger* is scoped, by
      # re-running only when that named test is the single failure. Any other
      # failing test, or a second failure alongside it, fails the step on the
      # first attempt with no retries. So a compiler regression never buys free
      # attempts, and an unrelated flake elsewhere in the suite stays visible
      # rather than being absorbed here.
      #
      # The failure count is read from the run summary line, not by counting
      # `FAIL` lines: the two can legitimately disagree (a failing test with no
      # error field emits no FAIL line, and native EUnit failures come back as
      # one opaque blob rather than one line per test), so only the summary
      # count is authoritative. Both formats are pinned by
      # `summary_line_is_a_ci_contract` / `fail_detail_line_is_a_ci_contract` in
      # crates/beamtalk-cli/src/commands/test.rs — if those tests fail, the
      # parsing below needs updating in the same change.
      #
      # Anything unrecognised — no summary line at all (compile error, crash,
      # timeout), a renamed test — fails closed with no retry, never "retry
      # everything".
      #
      # The durable fix belongs upstream in jamesc/beamtalk-http: point that test
      # at the package's own local test server, or gate it behind an opt-in
      # network tag. Drop this whole step wrapper once the suite is hermetic.
      - name: Test beamtalk-http
        working-directory: _packages/beamtalk-http
        env:
          ATTEMPTS: 3
          FLAKY_TEST: testHttpsGetReturnsOkStatus
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/beamtalk-http-test.log"
          for attempt in $(seq 1 "$ATTEMPTS"); do
            # tee, not redirect: keep output streaming live in the Actions UI
            # while still capturing it for the failure-signature check below.
            if beamtalk test 2>&1 | tee "$log"; then
              if [ "$attempt" -gt 1 ]; then
                echo "::warning title=beamtalk-http tests flaked::Suite passed on attempt ${attempt} of ${ATTEMPTS} — ${FLAKY_TEST} failed earlier in this job, likely runner network noise"
              fi
              exit 0
            fi

            # Retry only the known network flake: the run summary must report
            # exactly one failure, and the sole FAIL line must name FLAKY_TEST.
            failed_count=$(sed -nE 's/^[0-9]+ file\(s\), [0-9]+ tests, [0-9]+ passed, ([0-9]+) failed \([0-9.]+s\)$/\1/p' "$log" | tail -1)
            fail_lines=$(grep -c '^FAIL ' "$log" || true)
            if [ "$failed_count" != "1" ] || [ "$fail_lines" != "1" ] || ! grep -q "^FAIL .*${FLAKY_TEST}" "$log"; then
              echo "::error title=beamtalk-http tests failed::Not the known network flake (summary reports '${failed_count:-no}' failure(s), ${fail_lines} FAIL line(s)) — failing without retry"
              exit 1
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              backoff=$((attempt * 10))
              echo "Attempt ${attempt} of ${ATTEMPTS} failed on ${FLAKY_TEST} only — retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error title=beamtalk-http tests failed::${FLAKY_TEST} failed all ${ATTEMPTS} attempts — persistent, treat as a real failure rather than network noise"
          exit 1
