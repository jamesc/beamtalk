# LiveView IDE Docker image
# =========================
# Builds the container image for the LiveView IDE (bt_attach), the turnkey
# artifact for ADR 0091's remote/OIDC deployment
# (docs/deployment/remote-liveview-ide.md).
#
# The IDE ships on its own lane (BT-2512), separate from the core toolchain
# bundle. Since BT-5313 (ADR 0154 § 10) the image is built once per release
# candidate and published by retagging those exact bytes, never by rebuilding:
#
#   build-and-attach  (`push_rc`) release.yml's tag flow builds the image and
#                     pushes it as ghcr.io/<owner>/beamtalk-ide:rc-<sha>, where
#                     <sha> is the full commit (`dryrun-<sha>` for a release.yml
#                     dry run, so it never moves a real candidate's tag). The `image` output is that push
#                     pinned by digest (…/beamtalk-ide@sha256:<digest>); it goes
#                     into the uat dispatch payload as `ide_image`.
#   publish           (`publish` + `image` + `version`) retags the given digest
#                     as :<version> and :latest. No build. Callable only from
#                     promote.yml once RELEASE_PUBLISH_MODE=promote
#                     (scripts/ci/publish-guard.sh); until then release.yml's
#                     interim-publish job calls it, as the release used to.
#
# Trigger modes:
#   - pull_request (Dockerfile-related paths): build only, verifies the image
#     builds. No registry push.
#   - workflow_call: release.yml (build-and-attach, interim publish) and, from
#     BT-5315, promote.yml (publish).
#   - workflow_dispatch: build, and push rc-<sha> only when `push_rc`; or
#     publish a digest when `publish`.
#
# Windows is out of scope (browser-only client per ADR 0091).
#
# Related: liveview-release.yml (archive lane), release.yml (core bundle)
# Issue: BT-2516 (epic BT-2512), BT-5313

name: LiveView IDE Docker

on:
  pull_request:
    branches: [main]
    paths:
      - 'editors/liveview/Dockerfile'
      - 'editors/liveview/.dockerignore'
      - '.github/workflows/liveview-docker.yml'
  workflow_dispatch:
    inputs:
      push_rc:
        description: 'Push the build to GHCR as rc-<sha> (otherwise build only)'
        required: false
        type: boolean
        default: false
      publish:
        description: 'Publish: retag `image` as `version` and latest (no build). Refused unless RELEASE_PUBLISH_MODE allows this caller.'
        required: false
        type: boolean
        default: false
      image:
        description: 'With publish: the tested image, ghcr.io/<owner>/beamtalk-ide@sha256:<digest>'
        required: false
        type: string
        default: ''
      version:
        description: 'With publish: the version tag to give it (e.g. 0.6.0)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (default: the caller''s ref)'
        required: false
        type: string
        default: ''
      push_rc:
        description: 'Push the build to GHCR as <tag_prefix>-<sha>'
        required: false
        type: boolean
        default: false
      tag_prefix:
        description: 'With push_rc: rc for a release candidate, dryrun for a release.yml dry run'
        required: false
        type: string
        default: rc
      publish:
        description: 'Publish: retag `image` as `version` and latest (no build)'
        required: false
        type: boolean
        default: false
      image:
        description: 'With publish: the tested image, ghcr.io/<owner>/beamtalk-ide@sha256:<digest>'
        required: false
        type: string
        default: ''
      version:
        description: 'With publish: the version tag to give it (e.g. 0.6.0)'
        required: false
        type: string
        default: ''
    outputs:
      image:
        description: 'With push_rc: the pushed rc-<sha> image pinned by digest'
        value: ${{ jobs.docker.outputs.image }}

concurrency:
  # Keyed by what is built or published, not only the caller's ref: two
  # release.yml runs from one branch, or a dry run and a real tag at one
  # commit (tag_prefix), must not cancel each other's image.
  group: liveview-docker-${{ inputs.ref || inputs.image || github.ref }}-${{ inputs.tag_prefix || 'rc' }}-${{ inputs.publish && 'publish' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Build (and, with push_rc, push rc-<sha>) ──────────────────────────
  docker:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push rc-<sha>
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # PRs always build only (verifies the Dockerfile) and never push.
      - name: Resolve build parameters
        id: params
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          PUSH_RC: ${{ github.event_name != 'pull_request' && inputs.push_rc }}
          PREFIX: ${{ inputs.tag_prefix || 'rc' }}
        run: |
          push=false
          [ "${PUSH_RC}" = "true" ] && push=true
          case "${PREFIX}" in rc | dryrun) ;; *) echo "::error::tag_prefix must be rc or dryrun"; exit 1 ;; esac
          {
            echo "version=$(tr -d '[:space:]' < VERSION)"
            # ghcr image refs must be lowercase.
            echo "image=ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/beamtalk-ide"
            echo "sha=$(git rev-parse HEAD)"
            echo "push=${push}"
            echo "handle=${PREFIX}-$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.params.outputs.push == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Build image
        env:
          IMAGE: ${{ steps.params.outputs.image }}
          VERSION: ${{ steps.params.outputs.version }}
          SHA: ${{ steps.params.outputs.sha }}
          HANDLE: ${{ steps.params.outputs.handle }}
        run: |
          docker build \
            -f editors/liveview/Dockerfile \
            --build-arg VERSION="${VERSION}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -t "${IMAGE}:${HANDLE}" \
            editors/liveview

      # The digest is the identity uat tests and promote.yml retags; the
      # rc-<sha> tag is only a handle to find it.
      - name: Push <prefix>-<sha> and record its digest
        id: push
        if: steps.params.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.params.outputs.image }}
          HANDLE: ${{ steps.params.outputs.handle }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${HANDLE}"
          # Ask the registry, not the local store: this is what the tag resolves
          # to, the same lookup promote.yml makes before retagging.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${HANDLE}" --format '{{.Manifest.Digest}}')"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest '${digest}' for ${IMAGE}:${HANDLE}"
            exit 1
          fi
          pinned="${IMAGE}@${digest}"
          echo "image=${pinned}" >> "$GITHUB_OUTPUT"
          {
            echo "## IDE image (release candidate)"
            echo ""
            echo "| Tag | Digest |"
            echo "|---|---|"
            echo "| \`${IMAGE}:${HANDLE}\` | \`${pinned##*@}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Publish: retag a tested digest as <version> and latest ────────────
  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # retag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/publish-guard.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check this caller may publish
        env:
          RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE }}
        run: scripts/ci/publish-guard.sh "IDE image publish"

      - name: Validate inputs
        id: params
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_REF: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          repo="ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/beamtalk-ide"
          if ! [[ "${IMAGE_REF}" =~ ^${repo}@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image must be ${repo}@sha256:<digest>, got '${IMAGE_REF}'"
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a release version such as 0.6.0, got '${VERSION}'"
            exit 1
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      # imagetools copies the manifest by digest: the published tags point at
      # exactly the bytes that were tested.
      - name: Retag as <version> and latest
        env:
          REPO: ${{ steps.params.outputs.repo }}
          IMAGE_REF: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${REPO}:${VERSION}" -t "${REPO}:latest" "${IMAGE_REF}"
          docker buildx imagetools inspect "${REPO}:${VERSION}"
          echo "Published \`${IMAGE_REF##*@}\` as \`${REPO}:${VERSION}\` and \`:latest\`." >> "$GITHUB_STEP_SUMMARY"
