name: CI

# docs/learning/** is put back after '!docs/**' (a later pattern overrides an
# earlier one): its fixtures and chapters feed corpus.json (check-corpus) and
# the test-learn job (BT-3927), so a learning-guide-only change must still
# run CI. ci-docs-only.yml excludes it for the same reason.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - 'docs/learning/**'
      - '!LICENSE'
      - '!SECURITY.md'
      - '!.github/skills/**'
      - '!.devcontainer/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - 'docs/learning/**'
      - '!LICENSE'
      - '!SECURITY.md'
      - '!.github/skills/**'
      - '!.devcontainer/**'

# PR runs cancel the superseded run for the same PR. A push to main is keyed on
# its own SHA and never cancelled: main is the safety net for everything the PR
# path skips (the older OTP, path-gated jobs), so every merge must get a complete
# verdict even when the next merge lands minutes later (BT-4209). This workflow
# never reacts to labels; the opt-in macOS/Windows/desktop run is ci-platforms.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Path decisions, computed once (BT-4209) ───────────────────────────
  # Every "does this PR touch X?" decision lives here and nowhere else. Jobs
  # gate on these outputs with a job-level `if:`, so a job that has nothing to
  # do never takes a runner (it used to occupy one just to exit from a
  # step-level filter). On a push to main every path gate is true: main runs
  # the full Linux suite, for every OTP in the window. macOS, Windows and the
  # desktop tests are ci-platforms.yml's (schedule / workflow_dispatch / the
  # `ci:all-platforms` PR label); only the ubuntu desktop leg for a PR touching
  # the desktop app's own paths stays here.
  #
  # The corpus-tier path list is not repeated here: it lives in
  # scripts/ci/corpus-gate.sh, which `just ci-changed` also calls.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A PR touched the desktop app's own paths: test-desktop (ubuntu) runs.
      # Never true on a push to main.
      desktop: ${{ steps.filter.outputs.desktop }}
      # crates/beamtalk-core|codegen|repl, stdlib/, examples/, the runtime
      # fixtures and the other corpus sources the tier's tests read,
      # Cargo.toml/lock, Justfile, ci.yml: can change the Rust corpus tier's
      # verdict (scripts/ci/corpus-gate.sh).
      corpus: ${{ steps.filter.outputs.corpus }}
      # crates/beamtalk-codegen/ changed: core-diff has something to report.
      codegen: ${{ steps.filter.outputs.codegen }}
      # The core-diff snapshot pipelines changed: core-diff-modes has work.
      core_diff_modes: ${{ steps.filter.outputs.core_diff_modes }}
      # docs/learning/ or the doctest pipeline changed: test-learn has work.
      learn: ${{ steps.filter.outputs.learn }}
      # runtime/ changed: test-dialyzer runs the (slow) `just dialyzer` step.
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute path gates
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push (main): the full Linux suite; no desktop (ci-platforms.yml's).
            {
              echo "desktop=false"
              for k in corpus codegen core_diff_modes learn runtime; do echo "$k=true"; done
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"

          # matches PATTERN...: true when any changed path matches a shell glob
          # (`*` crosses `/`, so `dir/*` is a prefix match).
          matches() {
            local path pat
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              for pat in "$@"; do
                # shellcheck disable=SC2254
                case "$path" in $pat) return 0 ;; esac
              done
            done <<< "$changed"
            return 1
          }
          flag() { if "$@"; then echo true; else echo false; fi; }

          # Corpus tier: one path list, shared with `just ci-changed`.
          if printf '%s\n' "$changed" | scripts/ci/corpus-gate.sh; then corpus=true; else corpus=false; fi

          codegen=$(flag matches 'crates/beamtalk-codegen/*')

          core_diff_modes=$(flag matches \
            crates/beamtalk-cli/src/commands/build_stdlib.rs \
            crates/beamtalk-cli/src/commands/test.rs \
            crates/beamtalk-cli/src/commands/test_stdlib.rs \
            crates/beamtalk-cli/src/commands/util.rs \
            Justfile)

          learn=$(flag matches \
            'docs/learning/*' .github/workflows/ci.yml Justfile \
            'crates/beamtalk-cli/src/commands/test*.rs' \
            crates/beamtalk-cli/src/beam_compiler.rs \
            runtime/apps/beamtalk_runtime/src/beamtalk_stdlib_test.erl \
            runtime/apps/beamtalk_stdlib/src/beamtalk_test_case.erl \
            runtime/apps/beamtalk_stdlib/src/beamtalk_test_runner.erl)

          runtime=$(flag matches 'runtime/*')

          # The desktop app's own paths (the crate, the workspace crates it
          # links, the root manifest and lockfile those crates take their
          # `.workspace = true` deps from, the recipe and this workflow).
          # Defined once, here.
          desktop=$(flag matches 'desktop/*' 'crates/beamtalk-desktop-broker/*' \
              'crates/beamtalk-desktop-shell/*' 'crates/beamtalk-home/*' 'crates/beamtalk-workspace/*' \
              Cargo.toml Cargo.lock Justfile .github/workflows/ci.yml '.github/actions/test-desktop/*')

          {
            echo "desktop=$desktop"
            echo "corpus=$corpus"
            echo "codegen=$codegen"
            echo "core_diff_modes=$core_diff_modes"
            echo "learn=$learn"
            echo "runtime=$runtime"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # ─── Linux build, lint and Rust tests, as parallel jobs (BT-4209) ──────
  # These used to be one ubuntu `check` job (~16 min of build, clippy, fmt,
  # lints and the fast Rust tier) followed by the ~15 min corpus tier in the
  # same job. Splitting them lets each run in parallel on its own runner, so a
  # typical PR's wall-clock is the slowest job, not their sum. macOS and
  # Windows are ci-platforms.yml's opt-in `platform-check` job.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Node.js for fmt-check-js
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Check Cargo.lock is up to date
        # The root Cargo.lock is committed; fail if Cargo.toml changed without it.
        run: cargo tree --locked --workspace --depth 0 > /dev/null

      # The lint-* recipes carry their own history: lint-workaround-comments
      # (BT-2347 ratchet, BT-2841), lint-binary-literal-encoding (BT-3026),
      # test-grammar (BT-3261), lint-removed-facade-names (BT-3646, ADR 0129),
      # lint-nlr-tuple-matches (BT-3758), lint-class-var-catchers (BT-3769,
      # ADR 0130 §4), test-lint-stamp (BT-3926). See their Justfile comments.
      - name: Clippy, format and repo lints
        run: just clippy fmt-check lint-workaround-comments lint-binary-literal-encoding lint-removed-facade-names lint-nlr-tuple-matches lint-class-var-catchers test-grammar test-lint-stamp

      - name: Surface parity drift check (BT-2082)
        # Verifies REPL ops × CLI × MCP × LSP coverage matches
        # docs/development/surface-parity.md. Fails fast on inventory drift.
        run: just check-surface-drift

  # The fast Rust tier on Linux (everything but the corpus tier, which is the
  # test-corpus job). Full test-stdlib/test-bunit/test-runtime run in the
  # test-beam / test-runtime jobs.
  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Prebuilt cargo-nextest from nextest's own CDN (see ci-platforms.yml's `platform-check` job).
      - name: Install cargo-nextest
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 5 --retry-connrefused --retry-delay 2 --connect-timeout 20 \
            "https://get.nexte.st/0.9.148/linux" | tar -xz -C "$bin"
          cargo nextest --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      # build first: the CLI integration tests exec the real `beamtalk` binary
      # against the built runtime and stdlib.
      - name: Build and Rust tests
        run: just build test-rust

  # ─── Rust corpus tier (ADR 0111/0131 state-threading proofs) ───────────
  # `just test-corpus` (agreement and corpus proofs, ~15 min as one job) runs
  # on a PR only when scripts/ci/corpus-gate.sh (via the `changes` job) says the
  # changed paths can affect it, and always on a push to main. Sharded in two
  # with nextest --partition so the tier fits the PR time budget; the tests
  # are OS-independent, so Linux only.
  test-corpus:
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # erlc: the repl crate's assembler corpora compile generated Core Erlang.
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install cargo-nextest
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 5 --retry-connrefused --retry-delay 2 --connect-timeout 20 \
            "https://get.nexte.st/0.9.148/linux" | tar -xz -C "$bin"
          cargo nextest --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Rust corpus tier (state-threading agreement and corpus proofs)
        run: just test-corpus count:${{ matrix.shard }}/2

  # ─── Desktop app (Tauri) crate tests (BT-3061) ─────────────────────────
  # desktop/src-tauri is excluded from the root Cargo workspace (root
  # Cargo.toml's `exclude`, see desktop/README.md) because it needs the
  # Tauri toolchain — webkit2gtk-4.1/glib/gtk3 dev packages on Linux;
  # WebView2 (preinstalled) on Windows and WKWebView (part of the OS) on
  # macOS need no extra packages — that the rest of the workspace doesn't
  # require, so `just build`/`just test`'s `cargo build --workspace` never
  # touches it. That left this crate's `#[cfg(test)]` unit tests (e.g.
  # `commands::tests::locked_recovers_from_a_poisoned_mutex`) running only
  # via a manual local `cargo test -p beamtalk-desktop` (easy to forget) or
  # indirectly via desktop/e2e/'s whole-stack Playwright scripts — this job
  # closes that gap on every platform desktop-release.yml ships for
  # (BT-3061). Runs `just test-desktop`, which mirrors this same
  # webkit2gtk-4.1 install list from desktop-release.yml's build job (minus
  # `patchelf`, needed only for that lane's AppImage bundling, not for
  # compiling/testing this crate).
  #
  # Owned here only for the narrow case: ubuntu, on a PR (unlabelled) that
  # touches the desktop app's own paths, so a desktop change gets at least one
  # check. All three OSes (opt-in label, schedule, workflow_dispatch) are the
  # `platform-desktop` job in ci-platforms.yml. Both use the one composite
  # action, .github/actions/test-desktop.
  test-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/test-desktop

  # ─── Corpus drift check (BT-2737) ──────────────────────────────────────
  # crates/beamtalk-examples/corpus.json is generated from the .bt example/
  # test sources; this fails the PR if it wasn't regenerated after a source
  # change. Rust-only (no Erlang/OTP needed), so it stays fast.
  check-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Check corpus.json is up to date
        run: just check-corpus

  # ─── Codegen dependency boundary guard (BT-3371) ───────────────────────
  # BT-3362 split `codegen` out of `beamtalk-core` into `beamtalk-codegen`
  # specifically so beamtalk-lsp/beamtalk-lint (analysis only, never
  # generation) stop compiling it. Nothing else re-checks that on every PR —
  # a future dependency edge back onto beamtalk-codegen would compile and
  # pass every existing test, silently regressing the build-time win. Rust-only
  # (just resolves the dependency graph, no compilation needed), so it stays fast.
  check-codegen-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Check beamtalk-lsp/beamtalk-lint do not depend on beamtalk-codegen
        run: just check-codegen-boundary

  # ─── Corpus .core diff harness (BT-3509, ADR 0122 Phase 0) ────────────
  # Informational: reports whether a PR touching crates/beamtalk-codegen/
  # changes generated Core Erlang for the stdlib + bootstrap-test corpus
  # versus origin/main, without blocking merge — every migration in the
  # ADR 0122 epic is meant to be byte-identical except its own documented,
  # reviewed exception, so this is a signal for reviewers, not a gate.
  # Add the `core-diff:enforce` label to a PR to make a real diff fail
  # this job instead. See docs/development/testing-strategy.md § Corpus
  # `.core` diff harness.
  core-diff:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      # BT-3887: the base-side snapshot is a pure function of the PR's base
      # SHA (`just core-diff-base-snapshot` builds it from a worktree of that
      # commit alone), so it's cached by that SHA. Cache entries saved from a
      # PR branch are visible only to that branch (and this job never runs
      # on `main`), so in practice that is one build per PR per base SHA:
      # every later push to the same PR hits, a second PR on the same base
      # does not. The key
      # also carries this checkout's Justfile (its `core-diff-base-snapshot`
      # recipe drives the build; the base's own recipes do the snapshotting
      # and normalising, and those are pinned by the SHA already) and
      # `.tool-versions` (the OTP this job installs, which compiles the base
      # too), so a driver-recipe or toolchain change can never reuse a stale
      # snapshot. No `restore-keys`: a near-miss is the wrong base, not a
      # usable one. `actions/cache/restore` + `save` rather than the combined
      # action so the save happens only after a *successful* miss build, and
      # happens even when the diff step below then reports differences.
      - name: Restore cached base-side .core snapshot
        id: base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: target/core-diff/base
          key: core-diff-base-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-${{ hashFiles('Justfile', '.tool-versions') }}

      # Informational like the rest of this job: a base build failure must
      # not go red on its own (`continue-on-error`), and it leaves no partial
      # directory behind, so the diff step below fails loudly on "no base
      # snapshot" instead of diffing against half of one.
      - name: Snapshot the PR base (cache miss)
        if: steps.base-cache.outputs.cache-hit != 'true'
        id: base-snapshot
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          just core-diff-base-snapshot "$BASE_SHA" target/core-diff/base \
            || { rm -rf target/core-diff/base; exit 1; }

      - name: Save base-side .core snapshot to cache
        if: >-
          steps.base-cache.outputs.cache-hit != 'true' &&
          steps.base-snapshot.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: target/core-diff/base
          key: ${{ steps.base-cache.outputs.cache-primary-key }}

      - name: Run corpus .core diff against the PR base
        id: core-diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_CACHE_HIT: ${{ steps.base-cache.outputs.cache-hit }}
        run: |
          set +e
          just core-diff "$BASE_SHA" target/core-diff/base > core-diff.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          if [ "$BASE_CACHE_HIT" = "true" ]; then
            base_source="restored from cache"
          else
            base_source="built in this run (cache miss)"
          fi
          {
            echo '## Corpus `.core` diff (BT-3509)'
            echo "Base snapshot \`${BASE_SHA}\`: ${base_source}."
            echo '```'
            tail -c 60000 core-diff.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat core-diff.log

      - name: Fail if this PR opted in to enforcement
        if: >-
          steps.core-diff.outputs.exit_code != '0' &&
          contains(github.event.pull_request.labels.*.name, 'core-diff:enforce')
        run: |
          echo "core-diff found generated Core Erlang differences and this PR carries the 'core-diff:enforce' label — failing."
          exit 1

  # ─── core-diff snapshot-only vs full equivalence (BT-3934) ────────────
  # `core-diff`'s snapshot-only mode (BT-3887) is only sound if it leaves
  # exactly the same `.core` files as a full run. This job snapshots the PR
  # head in both modes and fails on any difference. Runs only when the
  # command pipelines or core-diff recipes change.
  core-diff-modes:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core_diff_modes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Compare snapshot-only and full .core output
        run: just core-diff-modes

  # ─── OTP support-window matrix (ADR 0125 §3.1, BT-3572) ────────────────
  # otp-support.toml is the single declared source of the OTP support
  # window; this job is the only place ci.yml turns it into GitHub Actions
  # matrix values, via `just otp-matrix` (a thin wrapper over the hidden
  # `beamtalk otp-matrix` subcommand — crates/beamtalk-cli/src/otp_support.rs
  # is the one reader). No Erlang/OTP install needed here: the reader is
  # pure Rust and needs no running BEAM. The drift test
  # (crates/beamtalk-cli/tests/cli/cli_otp_matrix.rs) asserts this same
  # subcommand's output equals the declared window, so this job's matrix can
  # never silently drift from doctor's/build's/release's own window checks.
  otp-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.otp-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      # A PR gets only the newest OTP in the window (`last` after the numeric
      # sort); a push to main gets the full window. See the comment above
      # test-beam.
      - name: Compute OTP support-window matrix
        id: otp-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          matrix="$(just otp-matrix)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            matrix="$(jq -c 'sort_by(tonumber) | [last]' <<< "$matrix")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ─── Full test suite on Linux only (requires Erlang/OTP) ──────────────
  # Split into parallel jobs for faster CI (~5 min wall-clock vs ~16 min sequential).
  # Each job restores Rust + Erlang caches and does a fast incremental build (~40s).
  # Rust unit tests already run in the 'lint' / 'test-rust' jobs above (and ci-platforms.yml's 'platform-check').
  #
  # test-beam, test-runtime and test-dialyzer additionally run across every
  # OTP major in the otp-matrix job's window (ADR 0125 §3.1) — at minimum
  # `just test`'s Erlang-touching stages and `just dialyzer` itself, per
  # BT-3572's acceptance criteria. That full window runs on every push to main
  # (post-merge); a pull request runs only the newest OTP in it (BT-4209), to
  # keep the PR fan-out small. The nightly workflow does not cover the older
  # OTPs (it runs the single .tool-versions OTP on macOS/Windows), so main is
  # where an older-OTP regression is caught. test-integration/test-parity stay pinned
  # to `.tool-versions`'s single OTP: they exercise the workspace/REPL/MCP
  # wire protocol, not OTP-version-sensitive compiled output.

  test-beam:
    needs: otp-matrix
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.otp-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # erlef/setup-beam errors if both `version-file` (which has its own
      # `erlang` line) and an explicit `otp-version` are given, so read just
      # `rebar3`'s pinned version out of .tool-versions and pass both
      # versions explicitly — `otp-version` varies per matrix leg, `rebar3`
      # stays the repo's single pinned version on every leg.
      - name: Read rebar3 version from .tool-versions
        id: tool-versions
        run: echo "rebar3=$(awk '/^rebar /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ steps.tool-versions.outputs.rebar3 }}
          version-type: loose
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Build
        run: just build

      - name: Test stdlib (compiled language features)
        run: just test-stdlib

      - name: Test BUnit (TestCase tests)
        run: just test-bunit

      # ADR 0111 / BT-3136 (confirmed still true as of BT-3149's close-out —
      # ThreadedIr moving from a per-construct verification-only side
      # channel to the real emission input for most state-threading codegen
      # didn't change this job's shape): no separate "verify-threaded-ir"
      # step here — its only prerequisites are test-stdlib and test-bunit
      # above, which this job already runs via `cargo run` in the dev
      # profile (debug_assertions on), so any threaded_ir::verify()
      # violation already hard-panics one of those two steps. A third
      # invocation would only recompile the same corpus for zero additional
      # detection (just's dependency dedup applies within one `just`
      # invocation, not across separate CI steps/processes — see `just
      # ci`'s single-invocation use of verify-threaded-ir for the case
      # where dedup does apply; `just ci-changed` relies on the same
      # reasoning to justify not adding a separate call after its own
      # unconditional `just test`, see that recipe's own comment).

      - name: Test metamorphic (BT-3117 — semantics-preserving transforms)
        run: just test-metamorphic

      - name: Test examples
        run: just test-examples

  test-runtime:
    needs: otp-matrix
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.otp-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
