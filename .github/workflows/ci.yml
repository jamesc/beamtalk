        run: just dialyzer

      - name: Dialyzer spec validation (generated -spec attributes)
        run: just dialyzer-specs

  # ─── Learning-guide doctests (BT-3927) ─────────────────────────────────
  # `just test-learn` compiles every docs/learning/ fixture and runs the
  # chapters' ```beamtalk blocks. It used to run nowhere in CI, so a fixture
  # that stopped compiling (ch12validation_error.bt against the file/class
  # name rule) went unnoticed. On a PR it runs only when the diff touches
  # docs/learning/, this workflow, the Justfile, or the doctest pipeline
  # itself (test-docs wrapper generation and test-class discovery, the BUnit
  # result entries, the FAIL/RESULTS: reporter and its parser); on a push
  # to main it always runs, so a compiler change that breaks the guide still
  # surfaces there.
  test-learn:
    needs: changes
    if: needs.changes.outputs.learn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Test learning guide (docs/learning/)
        run: just test-learn

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
