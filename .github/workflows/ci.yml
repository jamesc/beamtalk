      # erlef/setup-beam errors if both `version-file` (which has its own
      # `erlang` line) and an explicit `otp-version` are given, so read just
      # `rebar3`'s pinned version out of .tool-versions and pass both
      # versions explicitly — `otp-version` varies per matrix leg, `rebar3`
      # stays the repo's single pinned version on every leg.
      - name: Read rebar3 version from .tool-versions
        id: tool-versions
        run: echo "rebar3=$(awk '/^rebar /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ steps.tool-versions.outputs.rebar3 }}
          version-type: loose
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Build
        run: just build

      - name: Test Erlang runtime (unit tests)
        run: just test-runtime

      # BT-3937: test/sys.config writes warning-level logger output (e.g. the
      # ERTS `bad_dist_ext` warning behind a killed dist connection on OTP 27)
      # to beamtalk_test_warnings.log, below the console's error floor.
      - name: Upload runtime test warning log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-test-warnings-otp${{ matrix.otp }}
          path: runtime/**/beamtalk_test_warnings.log
          if-no-files-found: warn

  test-dialyzer:
    needs: [changes, otp-matrix]
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.otp-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # erlef/setup-beam errors if both `version-file` (which has its own
      # `erlang` line) and an explicit `otp-version` are given, so read just
      # `rebar3`'s pinned version out of .tool-versions and pass both
      # versions explicitly — `otp-version` varies per matrix leg, `rebar3`
      # stays the repo's single pinned version on every leg.
      - name: Read rebar3 version from .tool-versions
        id: tool-versions
        run: echo "rebar3=$(awk '/^rebar /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ steps.tool-versions.outputs.rebar3 }}
          version-type: loose
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Dialyzer PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            runtime/_build/default/*_plt
          key: ${{ runner.os }}-dialyzer-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
