name: CI

# docs/learning/** is put back after '!docs/**' (a later pattern overrides an
# earlier one): its fixtures and chapters feed the MCP example corpus that
# `just build` generates (build-corpus, BT-4614) and test-integration's
# test-learn step (BT-3927), so a learning-guide-only change must still run
# CI. docs/beamtalk-language-features.md is put back too: its code blocks also
# feed the corpus (BT-4554). build-corpus's docs_corpus_sources_trigger_full_ci
# test enforces both.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - 'docs/learning/**'
      - 'docs/beamtalk-language-features.md'
      - '!LICENSE'
      - '!SECURITY.md'
      - '!.github/skills/**'
      - '!.devcontainer/**'
  # Manual run (Actions tab or `gh workflow run ci.yml --ref <branch>`): the
  # `changes` job treats any non-PR event like a push to main, so a dispatch
  # runs the full Linux suite. Coverage is coverage.yml's (nightly, BT-4609).
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - 'docs/learning/**'
      - 'docs/beamtalk-language-features.md'
      - '!LICENSE'
      - '!SECURITY.md'
      - '!.github/skills/**'
      - '!.devcontainer/**'

# PR runs cancel the superseded run for the same PR. A push to main is keyed on
# its own SHA and never cancelled: main is the safety net for everything the PR
# path skips (the older OTP, path-gated jobs), so every merge must get a complete
# verdict even when the next merge lands minutes later (BT-4209). This workflow
# never reacts to labels; the opt-in macOS/Windows/desktop run is ci-platforms.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Path decisions, computed once (BT-4209) ───────────────────────────
  # Every "does this PR touch X?" decision lives here and nowhere else. Jobs
  # gate on these outputs with a job-level `if:`, so a job that has nothing to
  # do never takes a runner (it used to occupy one just to exit from a
  # step-level filter). On a push to main (or a workflow_dispatch) every path
  # gate is true: main runs
  # the full Linux suite, for every OTP in the window. macOS, Windows and the
  # desktop tests are ci-platforms.yml's (schedule / workflow_dispatch / the
  # `ci:all-platforms` PR label); only the ubuntu desktop leg for a PR touching
  # the desktop app's own paths stays here.
  #
  # The Rust corpus tier is corpus.yml's (opt-in on PRs, BT-4609).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A PR touched the desktop app's own paths: test-desktop (ubuntu) runs.
      # Never true on a push to main.
      desktop: ${{ steps.filter.outputs.desktop }}
      # The core-diff snapshot pipelines changed: core-diff-modes has work.
      core_diff_modes: ${{ steps.filter.outputs.core_diff_modes }}
      # docs/learning/ or the doctest pipeline changed: test-integration
      # runs its test-learn step.
      learn: ${{ steps.filter.outputs.learn }}
      # runtime/ changed: test-dialyzer runs the (slow) `just dialyzer` step.
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute path gates
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push (main) / workflow_dispatch: the full Linux suite; no
            # desktop (ci-platforms.yml's).
            {
              echo "desktop=false"
              for k in core_diff_modes learn runtime; do echo "$k=true"; done
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"

          # matches PATTERN...: true when any changed path matches a shell glob
          # (`*` crosses `/`, so `dir/*` is a prefix match).
          matches() {
            local path pat
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              for pat in "$@"; do
                # shellcheck disable=SC2254
                case "$path" in $pat) return 0 ;; esac
              done
            done <<< "$changed"
            return 1
          }
          flag() { if "$@"; then echo true; else echo false; fi; }

          core_diff_modes=$(flag matches \
            crates/beamtalk-cli/src/commands/build_stdlib.rs \
            crates/beamtalk-cli/src/commands/test.rs \
            crates/beamtalk-cli/src/commands/test_stdlib.rs \
            crates/beamtalk-cli/src/commands/util.rs \
            Justfile)

          learn=$(flag matches \
            'docs/learning/*' .github/workflows/ci.yml Justfile \
            'crates/beamtalk-cli/src/commands/test*.rs' \
            crates/beamtalk-cli/src/beam_compiler.rs \
            runtime/apps/beamtalk_runtime/src/beamtalk_stdlib_test.erl \
            runtime/apps/beamtalk_stdlib/src/beamtalk_test_case.erl \
            runtime/apps/beamtalk_stdlib/src/beamtalk_test_runner.erl)

          runtime=$(flag matches 'runtime/*')

          # The desktop app's own paths (the crate, the workspace crates it
          # links, the root manifest and lockfile those crates take their
          # `.workspace = true` deps from, the recipe and this workflow).
          # Defined once, here.
          desktop=$(flag matches 'desktop/*' 'crates/beamtalk-desktop-broker/*' \
              'crates/beamtalk-desktop-shell/*' 'crates/beamtalk-home/*' 'crates/beamtalk-workspace/*' \
              Cargo.toml Cargo.lock Justfile .github/workflows/ci.yml '.github/actions/test-desktop/*')

          {
            echo "desktop=$desktop"
            echo "core_diff_modes=$core_diff_modes"
            echo "learn=$learn"
            echo "runtime=$runtime"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # ─── Linux build, lint and Rust tests, as parallel jobs (BT-4209) ──────
  # These used to be one ubuntu `check` job (~16 min of build, clippy, fmt,
  # lints and the fast Rust tier) followed by the ~15 min corpus tier in the
  # same job. Splitting them lets each run in parallel on its own runner, so a
  # typical PR's wall-clock is the slowest job, not their sum. macOS and
  # Windows are ci-platforms.yml's opt-in `platform-check` job.
  #
  # Rust cache policy (BT-4609): every job that runs the dev-profile
  # `just build` shares one rust-cache entry (`shared-key: linux-test`), and
  # every rust-cache in this workflow saves only from main. A cache saved
  # from a PR is scoped to that PR's ref, so per-job keys saved per PR
  # multiplied into dozens of near-identical entries that pushed the repo
  # past the Actions cache cap and evicted the caches builds rely on. PR
  # runs restore main's entries.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Node.js for fmt-check-js
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Check Cargo.lock is up to date
        # The root Cargo.lock is committed; fail if Cargo.toml changed without it.
        run: cargo tree --locked --workspace --depth 0 > /dev/null

      # The lint-* recipes carry their own history: lint-workaround-comments
      # (BT-2347 ratchet, BT-2841), lint-binary-literal-encoding (BT-3026),
      # test-grammar (BT-3261), lint-removed-facade-names (BT-3646, ADR 0129),
      # lint-nlr-tuple-matches (BT-3758), lint-class-var-catchers (BT-3769,
      # ADR 0130 §4), lint-coverage-skips (BT-4408), lint-duplicate-erlang-modules
      # (BT-4671), test-lint-stamp (BT-3926). See their Justfile comments.
      - name: Clippy, format and repo lints
        run: just clippy fmt-check lint-workaround-comments lint-binary-literal-encoding lint-removed-facade-names lint-nlr-tuple-matches lint-class-var-catchers lint-old-style-catch lint-coverage-skips lint-duplicate-erlang-modules test-grammar test-github-extension test-lint-stamp

      - name: Surface parity drift check (BT-2082)
        # Verifies REPL ops × CLI × MCP × LSP coverage matches
        # docs/development/surface-parity.md. Fails fast on inventory drift.
        run: just check-surface-drift

      # BT-3362 split `codegen` out of `beamtalk-core` into `beamtalk-codegen`
      # so beamtalk-lsp/beamtalk-lint (analysis only) stop compiling it; this
      # guard fails a PR that adds a dependency edge back onto it, which would
      # otherwise compile and pass every test while regressing the build-time
      # win. It used to be its own job; it needs only the Rust toolchain +
      # Just (cargo metadata, no compilation), both already here, and it is
      # not a required status check, so folding it in saves a runner spin-up
      # per run for zero wall-clock cost (it takes seconds alongside clippy).
      - name: Check codegen dependency boundary (BT-3371)
        run: just check-codegen-boundary

      # Generated -spec attributes are OTP-independent, but the Dialyzer that
      # judges them is not (each OTP has its own built-in type set and spec
      # checks). So a PR — whose test-dialyzer only runs when runtime/
      # changed, while any codegen change can alter the specs — validates
      # them once here on the .tool-versions OTP, and a push to main /
      # workflow_dispatch validates them on every OTP in the window, in
      # test-dialyzer (BT-4379), keeping this PR-critical job no longer on
      # main than it needs to be. Needs the beamtalk binary + stdlib (built
      # via coverage-build, no --all-targets) and escript — both available.
      - name: Dialyzer spec validation (generated -spec attributes)
        if: github.event_name == 'pull_request'
        run: just dialyzer-specs

  # The fast Rust tier on Linux (everything but the corpus tier, which is
  # corpus.yml's test-corpus job). Full test-stdlib/test-bunit/test-runtime
  # run in the test-beam / test-runtime jobs.
  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      # build first: the CLI integration tests exec the real `beamtalk` binary
      # against the built runtime and stdlib.
      - name: Build and Rust tests
        run: just build test-rust

  # ─── Desktop app (Tauri) crate tests (BT-3061) ─────────────────────────
  # desktop/src-tauri is excluded from the root Cargo workspace (root
  # Cargo.toml's `exclude`, see desktop/README.md) because it needs the
  # Tauri toolchain — webkit2gtk-4.1/glib/gtk3 dev packages on Linux;
  # WebView2 (preinstalled) on Windows and WKWebView (part of the OS) on
  # macOS need no extra packages — that the rest of the workspace doesn't
  # require, so `just build`/`just test`'s `cargo build --workspace` never
  # touches it. That left this crate's `#[cfg(test)]` unit tests (e.g.
  # `commands::tests::locked_recovers_from_a_poisoned_mutex`) running only
  # via a manual local `cargo test -p beamtalk-desktop` (easy to forget) or
  # indirectly via desktop/e2e/'s whole-stack Playwright scripts — this job
  # closes that gap on every platform desktop-release.yml ships for
  # (BT-3061). Runs `just test-desktop`, which mirrors this same
  # webkit2gtk-4.1 install list from desktop-release.yml's build job (minus
  # `patchelf`, needed only for that lane's AppImage bundling, not for
  # compiling/testing this crate).
  #
  # Owned here only for the narrow case: ubuntu, on a PR (unlabelled) that
  # touches the desktop app's own paths, so a desktop change gets at least one
  # check. All three OSes (opt-in label, schedule, workflow_dispatch) are the
  # `platform-desktop` job in ci-platforms.yml. Both use the one composite
  # action, .github/actions/test-desktop.
  test-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/test-desktop

  # BT-4749: the release workspace build must stay warning-free and must not
  # link test-only codegen code (the `test` feature leaking in through
  # dev-dependency feature unification, e.g. via `--all-targets`).
  check-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-release-check
          key: profile-${{ hashFiles('Cargo.toml') }}
          workspaces: ". -> target/release-check"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check release build (warnings denied, no test-only code)
        run: just check-release-build

  # ─── core-diff snapshot-only vs full equivalence (BT-3934) ────────────
  # `core-diff`'s snapshot-only mode (BT-3887) is only sound if it leaves
  # exactly the same `.core` files as a full run. This job snapshots the PR
  # head in both modes and fails on any difference. Runs only when the
  # command pipelines or core-diff recipes change.
  core-diff-modes:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core_diff_modes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compare snapshot-only and full .core output
        run: just core-diff-modes

  # ─── OTP support-window matrix (ADR 0125 §3.1, BT-3572) ────────────────
  # otp-support.toml is the single declared source of the OTP support
  # window; this job is the only place ci.yml turns it into GitHub Actions
  # matrix values, via `just otp-matrix` (a thin wrapper over the hidden
  # `beamtalk otp-matrix` subcommand — crates/beamtalk-cli/src/otp_support.rs
  # is the one reader). No Erlang/OTP install needed here: the reader is
  # pure Rust and needs no running BEAM. The drift test
  # (crates/beamtalk-cli/tests/cli/cli_otp_matrix.rs) asserts this same
  # subcommand's output equals the declared window, so this job's matrix can
  # never silently drift from doctor's/build's/release's own window checks.
  otp-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.otp-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A PR gets only the newest OTP in the window (`last` after the numeric
      # sort); a push to main gets the full window. See the comment above
      # test-beam.
      - name: Compute OTP support-window matrix
        id: otp-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          matrix="$(just otp-matrix)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            matrix="$(jq -c 'sort_by(tonumber) | [last]' <<< "$matrix")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ─── Full test suite on Linux only (requires Erlang/OTP) ──────────────
  # Split into parallel jobs for faster CI (~5 min wall-clock vs ~16 min sequential).
  # Each job restores Rust + Erlang caches and does a fast incremental build (~40s).
  # Rust unit tests already run in the 'lint' / 'test-rust' jobs above (and ci-platforms.yml's 'platform-check').
  #
  # test-beam, test-runtime and test-dialyzer additionally run across every
  # OTP major in the otp-matrix job's window (ADR 0125 §3.1) — at minimum
  # `just test`'s Erlang-touching stages and `just dialyzer` itself, per
  # BT-3572's acceptance criteria. That full window runs on every push to main
  # (post-merge); a pull request runs only the newest OTP in it (BT-4209), to
  # keep the PR fan-out small. The nightly workflow does not cover the older
  # OTPs (it runs the single .tool-versions OTP on macOS/Windows), so main is
  # where an older-OTP regression is caught. test-integration stays pinned
  # to `.tool-versions`'s single OTP: its suites exercise the workspace/REPL/MCP
  # wire protocol, not OTP-version-sensitive compiled output.

  test-beam:
    needs: otp-matrix
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.otp-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # erlef/setup-beam errors if both `version-file` (which has its own
      # `erlang` line) and an explicit `otp-version` are given, so read just
      # `rebar3`'s pinned version out of .tool-versions and pass both
      # versions explicitly — `otp-version` varies per matrix leg, `rebar3`
      # stays the repo's single pinned version on every leg.
      - name: Read rebar3 version from .tool-versions
        id: tool-versions
        run: echo "rebar3=$(awk '/^rebar /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ steps.tool-versions.outputs.rebar3 }}
          version-type: loose
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: just build

      - name: Test stdlib (compiled language features)
        run: just test-stdlib

      - name: Test BUnit (TestCase tests)
        run: just test-bunit

      # ADR 0111 / BT-3136 (confirmed still true as of BT-3149's close-out —
      # ThreadedIr moving from a per-construct verification-only side
      # channel to the real emission input for most state-threading codegen
      # didn't change this job's shape): no separate "verify-threaded-ir"
      # step here — its only prerequisites are test-stdlib and test-bunit
      # above, which this job already runs via `cargo run` in the dev
      # profile (debug_assertions on), so any threaded_ir::verify()
      # violation already hard-panics one of those two steps. A third
      # invocation would only recompile the same corpus for zero additional
      # detection (just's dependency dedup applies within one `just`
      # invocation, not across separate CI steps/processes — see `just
      # ci`'s single-invocation use of verify-threaded-ir for the case
      # where dedup does apply; `just ci-changed` relies on the same
      # reasoning to justify not adding a separate call after its own
      # unconditional `just test`, see that recipe's own comment).

      - name: Test metamorphic (BT-3117 — semantics-preserving transforms)
        run: just test-metamorphic

      - name: Test examples
        run: just test-examples

      - name: Build examples (BT-4747)
        run: just build-examples

  test-runtime:
    needs: otp-matrix
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.otp-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # erlef/setup-beam errors if both `version-file` (which has its own
      # `erlang` line) and an explicit `otp-version` are given, so read just
      # `rebar3`'s pinned version out of .tool-versions and pass both
      # versions explicitly — `otp-version` varies per matrix leg, `rebar3`
      # stays the repo's single pinned version on every leg.
      - name: Read rebar3 version from .tool-versions
        id: tool-versions
        run: echo "rebar3=$(awk '/^rebar /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ steps.tool-versions.outputs.rebar3 }}
          version-type: loose
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: just build

      - name: Test Erlang runtime (unit tests)
        run: just test-runtime

      # BT-3937: test/sys.config writes warning-level logger output (e.g. the
      # ERTS `bad_dist_ext` warning behind a killed dist connection on OTP 27)
      # to beamtalk_test_warnings.log, below the console's error floor.
      - name: Upload runtime test warning log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-test-warnings-otp${{ matrix.otp }}
          path: runtime/**/beamtalk_test_warnings.log
          if-no-files-found: warn

  test-dialyzer:
    needs: [changes, otp-matrix]
    # The whole job only runs when runtime/ changed — on main (and on a
    # workflow_dispatch) that is always true. Its `dialyzer-specs` step runs
    # only there, across the full OTP window; a PR validates the specs once
    # in the lint job instead (see the comment there, BT-4379).
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.otp-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # erlef/setup-beam errors if both `version-file` (which has its own
      # `erlang` line) and an explicit `otp-version` are given, so read just
      # `rebar3`'s pinned version out of .tool-versions and pass both
      # versions explicitly — `otp-version` varies per matrix leg, `rebar3`
      # stays the repo's single pinned version on every leg.
      - name: Read rebar3 version from .tool-versions
        id: tool-versions
        run: echo "rebar3=$(awk '/^rebar /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ steps.tool-versions.outputs.rebar3 }}
          version-type: loose
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Dialyzer PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            runtime/_build/default/*_plt
          key: ${{ runner.os }}-dialyzer-otp${{ matrix.otp }}-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-otp${{ matrix.otp }}-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: just build

      - name: Dialyzer type checking (Erlang runtime)
        run: just dialyzer

      - name: Dialyzer spec validation (generated -spec attributes)
        if: github.event_name != 'pull_request'
        run: just dialyzer-specs

  # ─── Workspace, REPL-protocol, parity and learning-guide tests ────────
  # One job, one `just build`, for every suite that needs the built stdlib
  # on `.tool-versions`'s OTP. test-parity and test-learn used to be jobs of
  # their own, each paying a ~4 min build and a runner slot (BT-4609); PR
  # wall-clock is dominated by waiting for a free runner, so one job running
  # them back to back finishes sooner than three queued ones. Every suite
  # after the build runs even when an earlier one failed (`!cancelled()`
  # plus a successful build), so one red suite never hides another's verdict.
  #
  # Learning-guide doctests (BT-3927): `just test-learn` compiles every
  # docs/learning/ fixture and runs the chapters' ```beamtalk blocks. On a
  # PR it runs only when the diff touches docs/learning/, this workflow, the
  # Justfile, or the doctest pipeline itself (the `learn` path gate); on a
  # push to main it always runs, so a compiler change that breaks the guide
  # still surfaces there.
  test-integration:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config', 'runtime/apps/beamtalk_runtime/src/**', 'runtime/apps/beamtalk_runtime/include/**') }}-beam-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-erlang-${{ hashFiles('runtime/rebar.config') }}-beam-${{ hashFiles('.tool-versions') }}
            ${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          key: profile-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        id: build
        run: just build

      - name: Test workspace integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just test-integration

      - name: Test MCP server integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just test-mcp

      - name: Test REPL protocol (full pipeline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just test-repl-protocol

      - name: Test parity (REPL / MCP / CLI / LSP)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just test-parity

      - name: Test learning guide (docs/learning/)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.learn == 'true' }}
        run: just test-learn

      # On any failure, surface epmd state + the most recent workspace startup
      # logs. The recurring "REPL did not report port" flake (BT-1599 and its
      # 2026-06 recurrence) means a workspace BEAM node booted but never became
      # healthy — startup.log holds the only crash/hang diagnostics, and they
      # are unrecoverable once the runner is gone.
      - name: Dump workspace startup logs
        if: failure()
        run: |
          epmd -names || true
          # startup.log holds VM boot / -eval crash output; workspace.log holds the
          # OTP logger stream where beamtalk_ws_handler writes session/auth failures
          # (e.g. "Session creation failed"). The "port accepting TCP but WS health
          # check failed" flake (BT-2532) leaves startup.log empty — the real cause
          # is in workspace.log — so dump both.
          for f in $(ls -t "$HOME"/.beamtalk/workspaces/*/startup.log "$HOME"/.beamtalk/workspaces/*/workspace.log 2>/dev/null | head -10); do
            echo "=== $f ==="
            cat "$f"
          done

  # ─── Installed-layout smoke test from a clean checkout (BT-4119) ───────
  # `just install` once shipped no stdlib class beams (bt@stdlib@*) from a
  # fresh checkout, and nothing caught it: `just test-install` only ran in
  # edge/nightly/release. This job runs it on every PR from the fresh actions
  # checkout. It deliberately restores no runtime/_build cache, so the build is
  # a clean-checkout build (an old _build could hide exactly this class of
  # bug). Cost: a release build plus the debug build `build-stdlib` uses
  # (~15-20 min cold, less with the Rust cache), in parallel with the other
  # jobs, so it adds runner time but little wall-clock. Linux only;
  # ci-platforms.yml and release/nightly cover the other OSes.
  test-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: install-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Smoke test install (clean checkout)
        run: just test-install
