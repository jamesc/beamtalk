name: Fuzz Triage

# When "Nightly Fuzzing" fails, have Claude read the failed jobs' logs and
# artifacts, reproduce and classify the failure, and file (or update) a Linear
# issue. Replaces the old GitHub-issue steps in fuzz.yml, which never ran: the
# "Check for fuzz failures" step exits 1 on purpose, which skips every later step
# that has no `if: always()`/`failure()`.
#
# `workflow_run` workflows run from the default branch, so this only takes effect
# once merged. Test it with a manual dispatch against a past failed run:
#   gh workflow run fuzz-triage.yml -f run_id=<Nightly Fuzzing run id>

on:
  workflow_run:
    workflows: ["Nightly Fuzzing"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Nightly Fuzzing run id to triage"
        required: true

concurrency:
  group: fuzz-triage-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage failed nightly fuzzing run
    runs-on: ubuntu-latest
    # Only the repo's own scheduled/manual runs on the default branch; never a fork
    # or PR run (the Claude and Linear secrets are exposed to this job).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    timeout-minutes: 45
    permissions:
      id-token: write       # OIDC token exchange for the OAuth subscription auth
      contents: read        # checkout the failed run's commit
      actions: read         # read the failed run's jobs, logs and artifacts

    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve the failed run's commit
        id: run
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq .head_sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1

      # Everything Claude needs is fetched here, so the agent itself needs no
      # `gh` access: the failed jobs' logs and every artifact the run uploaded.
      - name: Collect failure evidence
        run: |
          mkdir -p triage/artifacts triage/logs
          gh run view "${RUN_ID}" --json jobs,conclusion,headSha,url,createdAt > triage/run.json
          gh run view "${RUN_ID}" --log-failed > triage/logs/failed-jobs.log || true
          # Logs can be huge; keep the tail of each so the evidence fits in context.
          tail -n 2500 triage/logs/failed-jobs.log > triage/logs/failed-jobs.tail.log || true
          gh run download "${RUN_ID}" --dir triage/artifacts || true
          find triage -type f | sort

      # Expose the run's untrusted data (logs, crash inputs, fuzzed source) as
      # files to read; the prompt tells Claude to treat all of it as data.
      - name: Load triage prompt
        id: load_prompt
        run: |
          prompt_file="${RUNNER_TEMP}/fuzz-triage-prompt.txt"
          sed -e "s|@RUN_ID@|${RUN_ID}|g" \
              -e "s|@RUN_URL@|${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}|g" \
              -e "s|@SHA@|${{ steps.run.outputs.sha }}|g" \
              .github/claude-fuzz-triage-prompt.md > "${prompt_file}"
          {
            echo 'prompt<<__BTPROMPTEOF__'
            cat "${prompt_file}"
            echo '__BTPROMPTEOF__'
          } >> "$GITHUB_OUTPUT"

      # The key is referenced as ${LINEAR_API_KEY} (Claude Code expands env vars in
      # MCP headers) and set only on the action step, so it is not written to disk.
      - name: Write Linear MCP config
        run: |
          cat > "${RUNNER_TEMP}/linear-mcp.json" <<'JSON'
          {
            "mcpServers": {
              "linear": {
                "type": "http",
                "url": "https://mcp.linear.app/mcp",
                "headers": { "Authorization": "Bearer ${LINEAR_API_KEY}" }
              }
            }
          }
          JSON

      - name: Triage with Claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Trust boundary: the agent reads untrusted data (logs, fuzz inputs, fuzzed
          # source), so the tool list is kept small. It can read files with the Read,
          # Grep and Glob tools (not /proc), write only under triage/, run only
          # cargo fuzz/test/build (including the env-prefixed `CV_SEED=… cargo test`
          # repro form), just and read-only git, and use the Linear
          # issue tools. Not allowed: find, cat, other shell, git writes, the web.
          # `cargo` still executes this repo's build scripts (the checked-out
          # default-branch commit, which the agent cannot modify), and the OAuth token
          # and Linear key are in the job's environment, so injected instructions
          # could in principle still reach them through those tools; that residual
          # risk is why the prompt marks all fetched data as untrusted.
          claude_args: >-
            --max-turns 60
            --mcp-config ${{ runner.temp }}/linear-mcp.json
            --allowedTools "Read,Grep,Glob,Write(triage/**),Bash(cargo +nightly fuzz:*),Bash(cargo fuzz:*),Bash(cargo test:*),Bash(CV_SEED=* CV_SIZE=* CV_SHAPES=* cargo test:*),Bash(cargo build:*),Bash(just test-class-var-corpus:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(ls:*),mcp__linear__list_issues,mcp__linear__get_issue,mcp__linear__save_issue,mcp__linear__save_comment,mcp__linear__list_issue_labels,mcp__linear__list_issue_statuses,mcp__linear__list_teams"
            --disallowedTools "Read(//proc/**),Read(//home/runner/work/_temp/**)"
          prompt: ${{ steps.load_prompt.outputs.prompt }}

      - name: Remove Linear MCP config
        if: always()
        run: rm -f "${RUNNER_TEMP}/linear-mcp.json"

      - name: Add to job summary
        if: always()
        run: |
          echo "## Fuzz triage for run ${RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f triage/result.md ]; then cat triage/result.md >> "$GITHUB_STEP_SUMMARY"; else echo "Claude wrote no triage/result.md; see the job log." >> "$GITHUB_STEP_SUMMARY"; fi
