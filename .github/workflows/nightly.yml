#
# Nightly Cross-Platform Test Suite + Distribution Builds
# =========================================================
# Runs the full test suite on macOS and Windows to catch platform-specific
# issues that PR CI (Linux + macOS/Windows-minimal) would miss.
#
# After tests pass, builds distribution archives for all platforms and uploads
# them to the rolling "nightly" GitHub Release. install.sh --nightly picks
# these up.
#
# Linux is excluded from testing — it already gets full coverage on every PR
# via ci.yml — but is included for distribution builds.
# Linting (clippy, fmt, dialyzer) is skipped — platform-independent, Linux covers it.
#
# Skips if no commits landed in the last 24 hours.

name: Nightly

on:
  schedule:
    # 6am UTC daily (10pm PT, 7am CET)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      bench_only:
        description: 'Run only the vs-elixir bench job (skips the platform tests and dist builds)'
        type: boolean
        default: false
      threshold_pct:
        description: 'vs-elixir bench: override the regression threshold in percent (default 45; a tight value such as 0 exercises the confirming job)'
        type: string
        default: ''
      baseline_branch:
        description: 'vs-elixir bench: take the baseline from the last night of this branch (default: the branch being run)'
        type: string
        default: ''

concurrency:
  # Per ref: a branch dispatch must not cancel main's nightly (or the reverse).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The dtolnay action set this for every job; keep it now that rust-toolchain.toml installs the toolchain.
  CARGO_INCREMENTAL: "0"
  # Names the channel in `beamtalk --version` (BT-4812).
  BEAMTALK_BUILD_CHANNEL: nightly
  # vs-elixir-bench and vs-elixir-confirm (BT-4844, BT-4853): both jobs must use the same rows, rounds and threshold.
  BENCH_ROWS: 7a,7b,7c,7d,16a,16b,16c,16d
  BENCH_ROUNDS: '5'
  THRESHOLD_PCT: ${{ inputs.threshold_pct || '45' }}
  ARTIFACT_NAME: vs-elixir-nightly

jobs:
  # ─── Skip if no recent commits ──────────────────────────────────────
  check-activity:
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_commits: ${{ steps.check.outputs.has_commits }}
      nightly_date: ${{ steps.meta.outputs.date }}
      nightly_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for commits in last 24h
        id: check
        run: |
          if [ "${{ inputs.bench_only }}" = "true" ]; then
            # Only the bench job runs (its own `if` accepts bench_only).
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          elif git log --since="24 hours ago" --oneline | head -1 | grep -q .; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "No commits in last 24h — skipping nightly run"
          fi

      - name: Nightly metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  # ─── macOS ARM64 (Apple Silicon) ────────────────────────────────────
  macos:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: macos-15
    # Full test suite + dist build. Observed ~52-55min (tests alone reach
    # ~40min since the bench smoke step, BT-3886); 75 leaves ~20min headroom.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: nightly-${{ runner.os }}-arm64-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.lock', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            nightly-${{ runner.os }}-arm64-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build
        run: just build

      - name: Test Rust
        run: just test-rust

      - name: Bench smoke (criterion benches in test mode, BT-3886)
        run: just test-benches-smoke

      - name: Perf-script smoke (runtime/perf escripts, tiny counts, BT-5059)
        run: just test-perf-smoke

      - name: Test stdlib
        run: just test-stdlib

      - name: Test BUnit
        run: just test-bunit

      - name: Test Erlang runtime
        run: just test-runtime

      - name: Test workspace integration
        run: just test-integration

      - name: Test MCP server
        run: just test-mcp

      - name: Test REPL protocol
        run: just test-repl-protocol

      - name: Build distribution
        run: just install dist

      - name: Smoke test
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh nightly macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-nightly-macos-arm64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── Windows x86_64 (full suite) ───────────────────────────────────
  windows:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    # Pin to 2022: erlef/setup-beam@v1 doesn't support windows-2025 yet
    runs-on: windows-2022
    # Full test suite + release build. Observed ~78min on 2026-10-20 (run
    # 39483090844: build 14m, tests 47m, release build 15m); 100 leaves
    # ~20min headroom.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: profile-${{ hashFiles('Cargo.toml') }}

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/AppData/Local/rebar3
            runtime/_build
          key: nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.lock', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build
        run: just build

      - name: Test Rust
        run: just test-rust

      - name: Bench smoke (criterion benches in test mode, BT-3886)
        run: just test-benches-smoke

      - name: Test stdlib
        run: just test-stdlib

      - name: Test BUnit
        run: just test-bunit

      - name: Test Erlang runtime
        run: just test-runtime

      - name: Test workspace integration
        run: just test-integration

      - name: Test MCP server
        run: just test-mcp

      - name: Test REPL protocol
        run: just test-repl-protocol

      - name: Build Rust (release)
        run: cargo build --release --locked --quiet

      - name: Build standard library (release)
        shell: bash
        run: ./target/release/beamtalk.exe build-stdlib

      # package-release.sh installs target/share/ (the MCP example corpus,
      # BT-4614) into the archive, so it must be built first (BT-5077).
      - name: Build MCP example corpus
        shell: bash
        run: cargo run --release --locked --bin build-corpus --quiet

      - name: Package zip
        id: package
        shell: bash
        run: scripts/ci/package-release.sh nightly windows-x86_64

      # Windows verification of BT-5077's share/ data. 7z is on the runner
      # (package-release.sh uses it); the archive is extracted afresh so the
      # assertion sees exactly what a user installs.
      - name: Check archive share/ data
        shell: bash
        run: |
          rm -rf archive-check
          mkdir archive-check
          7z x -oarchive-check "${{ steps.package.outputs.archive }}" >/dev/null
          scripts/ci/check-archive-share.sh archive-check/beamtalk-*
          rm -rf archive-check

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-nightly-windows-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── macOS x86_64 (dist only) ──────────────────────────────────────
  macos-x86_64:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    runs-on: macos-15-intel
    # Dist build + smoke test on the slower Intel runner. Observed 36-46min;
    # 65 leaves ~20-30min headroom.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache-save-if: 'true'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: nightly-${{ runner.os }}-x86_64-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.lock', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            nightly-${{ runner.os }}-x86_64-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build and install distribution
        run: just install dist

      - name: Smoke test
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh nightly macos-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-nightly-macos-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── Linux x86_64 (dist only, testing covered by PR CI) ────────────
  linux:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    # Dist build + smoke test. Observed ~17min; 35 leaves ~18min headroom.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache-save-if: 'true'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.lock', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: Build distribution
        run: just dist

      - name: Smoke test
        run: just test-install

      - name: Package tarball
        id: package
        run: scripts/ci/package-release.sh nightly linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beamtalk-nightly-linux-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # ─── EUnit test isolation (BT-4934) ─────────────────────────────────
  # Runs the Erlang suites in the orders a normal `just test-runtime` never
  # uses, to catch a test module that relies on state another module left
  # behind: every module alone in a fresh node (`alone`), the whole suite in
  # reverse module order (`reverse`), and in a seeded random order (`random`;
  # the seed is printed in the log, rerun with
  # `just test-isolation random --seed S`). See scripts/ci/eunit-isolation.escript.
  #
  # A failure here is a real order dependency in a test module or leaked state.
  # All three modes fail the Nightly run like any other job and are triaged by
  # ci-triage.yml. `alone` also fails a module that leaves a bare-started
  # `beamtalk_*` server behind (it breaks the next module's runtime start), and
  # `random` (a new seed every night) is blocking since BT-4962: 30 consecutive
  # fresh seeds were clean on main before the exemption was removed. Reproduce
  # with `just test-isolation random --seed S`, minimise with
  # `escript scripts/ci/eunit-isolation.escript random --seed S
  # --print-order` + `forward --order <modules>`, and find which earlier module
  # pollutes a failing one with `just test-isolation culprit <module>`. It does
  # not gate `publish-nightly` (the distribution builds are independent).
  eunit-isolation:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [alone, reverse, random]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Beamtalk toolchain
        uses: ./.github/actions/setup-beamtalk
        with:
          rust-cache-save-if: 'true'

      - name: Cache Erlang/rebar3 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rebar3
            runtime/_build
            ~/.rebar3
          key: nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-${{ hashFiles('runtime/rebar.config', 'runtime/rebar.lock', 'runtime/apps/beamtalk_runtime/src/**') }}
          restore-keys: |
            nightly-${{ runner.os }}-erlang-beam-${{ hashFiles('.tool-versions') }}-

      - name: EUnit isolation (${{ matrix.mode }})
        env:
          MODE: ${{ matrix.mode }}
        run: just test-isolation "$MODE"

  # ─── vs-elixir actor rows: time compared with the previous night (BT-4844) ─
  # Runs rows 7a-7d and 16a-16d of benchmarks/vs-elixir and compares each row's
  # Beamtalk ns/op, relative to the same row's Elixir control, with the last
  # stored night of the same branch. Runner speed is the noise source, so a
  # row over THRESHOLD_PCT does not fail the night on its own (BT-4853): when
  # anything is over, job vs-elixir-confirm measures again on a fresh runner
  # and fails only the rows that are over in both. A normal night runs one job.
  # See benchmarks/vs-elixir/README.md § Nightly subset.
  vs-elixir-bench:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true' || inputs.bench_only
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # list and download the previous night's artifact
    outputs:
      over: ${{ steps.compare.outputs.over }}
      baseline_run_id: ${{ steps.baseline.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the actor rows
        uses: ./.github/actions/vs-elixir-bench
        with:
          rows: ${{ env.BENCH_ROWS }}
          rounds: ${{ env.BENCH_ROUNDS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the previous night's results
        id: baseline
        env:
          BASELINE_BRANCH: ${{ inputs.baseline_branch || github.ref_name }}
        run: |
          set -euo pipefail
          # Newest unexpired artifact of that name uploaded from a run on the
          # baseline branch. Artifacts exist only for passing nights.
          run_id="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$ARTIFACT_NAME" -f per_page=100 \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$BASELINE_BRANCH\")] | first | .workflow_run.id // empty")"
          if [ -z "$run_id" ]; then
            echo "No earlier results for branch $BASELINE_BRANCH: first run."
            exit 0
          fi
          mkdir -p bench-baseline
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D bench-baseline
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Baseline: run $run_id"

      # --defer: rows over the threshold are reported but do not fail here; the
      # confirming job decides. `over` is true when there is anything to confirm.
      - name: Compare with the previous night
        id: compare
        run: |
          args=(bench-out/results.json --threshold "$THRESHOLD_PCT" --summary "$GITHUB_STEP_SUMMARY"
                --defer --over-out bench-out/over.txt)
          if [ -f bench-baseline/results.json ]; then
            args+=(--baseline bench-baseline/results.json)
          fi
          python3 scripts/ci/vs_elixir_nightly.py compare "${args[@]}"
          if [ -s bench-out/over.txt ]; then
            echo "over=true" >> "$GITHUB_OUTPUT"
          else
            echo "over=false" >> "$GITHUB_OUTPUT"
          fi

      # Nothing over the threshold: tonight becomes the baseline. With rows
      # over, the confirming job stores the result (or nothing, if it fails),
      # so a regressed night never becomes the next baseline.
      - name: Store tonight's results
        if: steps.compare.outputs.over == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: bench-out/results.json
          retention-days: 30

      # The first measurement, for the confirming job.
      - name: Keep the first measurement
        if: steps.compare.outputs.over == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vs-elixir-first-measurement
          path: bench-out/results.json
          retention-days: 1

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vs-elixir-nightly-report
          path: bench-out/report.md
          retention-days: 14
          if-no-files-found: ignore

  # ─── Second measurement, only when the first found a row over the threshold ─
  # A fresh runner (a retry inside the first job would share its speed). Fails
  # only the rows over the threshold in both measurements, against the same
  # baseline, and stores the baseline for the next night: tonight's figures,
  # except that a row that was not confirmed keeps its baseline figures.
  vs-elixir-confirm:
    needs: vs-elixir-bench
    if: needs.vs-elixir-bench.outputs.over == 'true'
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN_ID: ${{ needs.vs-elixir-bench.outputs.baseline_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the actor rows
        uses: ./.github/actions/vs-elixir-bench
        with:
          rows: ${{ env.BENCH_ROWS }}
          rounds: ${{ env.BENCH_ROUNDS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the first measurement and the same baseline
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n vs-elixir-first-measurement -D bench-first
          if [ -n "$BASELINE_RUN_ID" ]; then
            mkdir -p bench-baseline
            gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D bench-baseline
          fi

      - name: Confirm the rows over the threshold
        run: |
          mkdir -p bench-out/merged
          args=(bench-out/results.json --first bench-first/results.json --threshold "$THRESHOLD_PCT"
                --summary "$GITHUB_STEP_SUMMARY" --merged-out bench-out/merged/results.json)
          if [ -f bench-baseline/results.json ]; then
            args+=(--baseline bench-baseline/results.json)
          fi
          python3 scripts/ci/vs_elixir_nightly.py confirm "${args[@]}"

      # Only reached when no row was confirmed.
      - name: Store tonight's results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: bench-out/merged/results.json
          retention-days: 30

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vs-elixir-nightly-report-confirm
          path: bench-out/report.md
          retention-days: 14
          if-no-files-found: ignore

  # ─── Publish nightly release ────────────────────────────────────────
  publish-nightly:
    needs: [check-activity, macos, macos-x86_64, windows, linux]
    # A workflow_dispatch on a branch (e.g. to time a CI change) builds and
    # tests but must not replace the `nightly` release, which says it is from main.
    if: github.ref == 'refs/heads/main'
    # Pinned, not floating: uat tests each target on the image that built it (ADR 0154 § 3).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that writes the `nightly` release (BT-5137).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the four platform packages: a bare download would also merge in the
      # benchmark reports and every other artifact of the run (BT-5094).
      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist-artifacts
          pattern: beamtalk-nightly-*
          merge-multiple: true

      - name: Assert the asset list
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            beamtalk-nightly-linux-x86_64.tar.gz \
            beamtalk-nightly-linux-x86_64.tar.gz.sha256 \
            beamtalk-nightly-macos-arm64.tar.gz \
            beamtalk-nightly-macos-arm64.tar.gz.sha256 \
            beamtalk-nightly-macos-x86_64.tar.gz \
            beamtalk-nightly-macos-x86_64.tar.gz.sha256 \
            beamtalk-nightly-windows-x86_64.zip \
            beamtalk-nightly-windows-x86_64.zip.sha256 | sort)"
          actual="$(find dist-artifacts -type f -printf '%f\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::nightly asset list differs from the expected one"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_DATE: ${{ needs.check-activity.outputs.nightly_date }}
          NIGHTLY_SHA: ${{ needs.check-activity.outputs.nightly_sha }}
        run: |
          # Update in place; the previous release is only replaced once the new
          # assets are uploaded (scripts/ci/publish-rolling-release.sh, BT-5094).
          cat > nightly-notes.md <<NOTES
          Automated nightly build from \`main\` at ${NIGHTLY_DATE}.

          **Commit:** ${NIGHTLY_SHA}
          **Full SHA:** ${GITHUB_SHA}

          > [!WARNING]
          > Nightly builds are untested beyond the standard test suite. Use \`--nightly\` with install.sh:
          > \`\`\`sh
          > curl -fsSL https://jamesc.github.io/beamtalk/install.sh | sh -s -- --nightly
          > \`\`\`
          NOTES
          scripts/ci/publish-rolling-release.sh nightly "${GITHUB_SHA}" \
            "Nightly Build (${NIGHTLY_DATE}, ${NIGHTLY_SHA})" nightly-notes.md \
            dist-artifacts/*

      # Hand uat the exact published bytes (ADR 0154 § 3, BT-5306): every
      # asset's sha256 plus the OTP window. Runs only after the release is updated.
      - name: Build uat dispatch payload
        id: uat
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          payload="$(scripts/ci/uat-dispatch-payload.sh nightly \
            "$(cat VERSION)-nightly+${SHORT_SHA}" nightly "${GITHUB_SHA}")"
          echo "payload=${payload}" >> "$GITHUB_OUTPUT"

      - name: Dispatch beamtalk-artifact to uat
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.UAT_DISPATCH_TOKEN }}
          repository: jamesc/beamtalk-uat
          event-type: beamtalk-artifact
          client-payload: ${{ steps.uat.outputs.payload }}
