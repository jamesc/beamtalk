name: CI Triage

# When "CI" fails on main, or the "Nightly" platform run fails, have Claude read
# the failed jobs' logs, find the culprit commit range, and file (or update) a
# Linear issue. Triage only: no reproduction, no code, no re-runs.
#
# `workflow_run` workflows run from the default branch, so this only takes effect
# once merged. Test it with a manual dispatch against a past failed main run:
#   gh workflow run ci-triage.yml -f run_id=<CI or Nightly run id>
#
# Secrets (Claude OAuth, Linear key) are exposed to the triage job only for runs of
# this repo's own main branch (any event but pull_request) or a manual dispatch, never
# for PR or fork runs. The agent reads logs written by arbitrary merged code, so the
# prompt treats them as untrusted data and the tool list is read-only plus Linear.

on:
  workflow_run:
    # "CI (all platforms)" is ci-platforms.yml (BT-4209): the scheduled macOS/Windows/
    # desktop run. Its schedule runs report head_branch main with event `schedule`, so
    # they pass the guard below; its labelled PR runs have event `pull_request` and do
    # not. If any of these workflows is renamed, update this list.
    workflows: ["CI", "Nightly", "CI (all platforms)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI or Nightly run id (main, not a PR) to triage"
        required: true

concurrency:
  group: ci-triage-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage failed main CI run
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    timeout-minutes: 30
    permissions:
      id-token: write       # OIDC token exchange for the OAuth subscription auth
      contents: read        # checkout the failed run's commit
      actions: read         # read the failed run's jobs, logs and artifacts
      pull-requests: read   # map commits to PRs

    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      # A dispatch takes an arbitrary run id: refuse anything that is not this
      # repo's own non-PR main run, so the secrets never meet PR/fork-written logs.
      - name: Resolve and validate the failed run
        id: run
        run: |
          gh api "repos/${REPO}/actions/runs/${RUN_ID}" \
            --jq '[.head_sha, .name, .head_branch, .event, .head_repository.full_name, .conclusion] | @tsv' > "${RUNNER_TEMP}/run.tsv"
          IFS=$'\t' read -r sha name branch event repo conclusion < "${RUNNER_TEMP}/run.tsv"
          if [ "${branch}" != "main" ] || [ "${event}" = "pull_request" ] || [ "${repo}" != "${REPO}" ]; then
            echo "::error::Run ${RUN_ID} is not a main-branch run of ${REPO} (branch=${branch} event=${event} repo=${repo}); refusing to triage."
            exit 1
          fi
          {
            echo "sha=${sha}"
            echo "workflow=${name}"
            echo "conclusion=${conclusion}"
          } >> "$GITHUB_OUTPUT"

      # The code under test: the commit the run failed on, with full history so the
      # agent can `git log <green_sha>..<red_sha>`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The triage config (prompt, composite action): always from the workflow's own
      # commit, not the failed one. Kept in a subdirectory so it cannot be mistaken
      # for, or overwritten by, the code under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .triage-config
          sparse-checkout: |
            .github/claude-ci-triage-prompt.md
            .github/actions/claude-triage/action.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Everything the agent needs up front, so it needs no more than read-only gh:
      # the run's jobs, the failed jobs' log tails, and recent main runs of the same
      # workflow (to find the last green commit).
      - name: Collect failure evidence
        env:
          WORKFLOW: ${{ steps.run.outputs.workflow }}
        run: |
          mkdir -p triage/logs
          gh run view "${RUN_ID}" --json jobs,conclusion,headSha,url,createdAt > triage/run.json
          gh run view "${RUN_ID}" --log-failed > triage/logs/failed-jobs.log || true
          # Logs can be huge; keep the tail so the evidence fits in context.
          tail -n 3000 triage/logs/failed-jobs.log > triage/logs/failed-jobs.tail.log || true
          gh run list --repo "${REPO}" --workflow "${WORKFLOW}" --branch main \
            --json databaseId,headSha,conclusion,event,createdAt,url --limit 40 \
            > triage/main-runs.json || true
          find triage -type f | sort

      - name: Load triage prompt
        id: load_prompt
        env:
          WORKFLOW: ${{ steps.run.outputs.workflow }}
          SHA: ${{ steps.run.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          prompt_file="${RUNNER_TEMP}/ci-triage-prompt.txt"
          sed -e "s|@RUN_ID@|${RUN_ID}|g" \
              -e "s|@RUN_URL@|${RUN_URL}|g" \
              -e "s|@SHA@|${SHA}|g" \
              -e "s|@WORKFLOW@|${WORKFLOW}|g" \
              -e "s|@REPO@|${REPO}|g" \
              .triage-config/.github/claude-ci-triage-prompt.md > "${prompt_file}"
          {
            echo 'prompt<<__BTPROMPTEOF__'
            cat "${prompt_file}"
            echo '__BTPROMPTEOF__'
          } >> "$GITHUB_OUTPUT"

      # Trust boundary: the logs are untrusted (merged code can print anything), so the
      # tool list is read-only: Read/Grep/Glob, `gh run`/`gh pr` reads, `gh api` GETs of
      # the actions runs/jobs, commits and pulls endpoints, read-only git, and the
      # Linear issue and comment tools. No Write/Edit, no cargo or tests, no web, no
      # other shell. The allowlist is a command prefix, so it cannot by itself stop
      # `gh api <allowed path> -X PATCH`; the guarantee is the token: `github-token`
      # is the job's read-only github.token, passed explicitly so claude-code-action
      # never mints its write-capable App token via OIDC (id-token: write is for the
      # Claude OAuth exchange only). A write attempt gets 403.
      - name: Triage with Claude
        uses: ./.triage-config/.github/actions/claude-triage
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          github-token: ${{ github.token }}
          prompt: ${{ steps.load_prompt.outputs.prompt }}
          max-turns: "40"
          artifact-name: ci-triage-execution-${{ github.run_id }}
          allowed-tools: "Read,Grep,Glob,Bash(gh run list:*),Bash(gh run view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/actions/runs/:*),Bash(gh api repos/${{ github.repository }}/actions/jobs/:*),Bash(gh api repos/${{ github.repository }}/commits/:*),Bash(gh api repos/${{ github.repository }}/pulls/:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),mcp__linear__list_issues,mcp__linear__get_issue,mcp__linear__list_comments,mcp__linear__save_issue,mcp__linear__save_comment,mcp__linear__list_issue_labels,mcp__linear__list_issue_statuses,mcp__linear__list_teams"

      - name: Add to job summary
        if: always()
        run: |
          {
            echo "## CI triage for run ${RUN_ID}"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"
            echo ""
            echo "The agent reports in Linear (comments end with an \"Automated triage\" line); its tool calls and denials are in the \"Show permission denials\" step and the execution-output artifact."
          } >> "$GITHUB_STEP_SUMMARY"
