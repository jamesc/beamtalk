[package]
name = "test-package-compiler"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Snapshot tests for beamtalk compiler"

[dev-dependencies]
# why: BT-4678 — the shared `erlc_available` probe lives in `test_support`,
# which the `test` feature gates.
beamtalk-core = { workspace = true, features = ["test"] }
beamtalk-codegen = { workspace = true }
insta = { workspace = true, features = ["glob"] }
camino = { workspace = true }
tempfile.workspace = true
