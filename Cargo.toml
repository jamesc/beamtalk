[workspace]
resolver = "2"
members = ["crates/*", "crates/beamtalk-examples/build-corpus", "test-package-compiler"]
# desktop/src-tauri (BT-2986): needs webkit2gtk-4.1 (Linux) / WebView2
# (Windows) / WKWebView (macOS) system deps + the cargo-tauri toolchain,
# neither guaranteed present everywhere the rest of the workspace builds —
# see desktop/README.md. Excluded so `cargo build --workspace` (`just
# build`/`just ci`) doesn't require them; wiring a CI build lane that
# installs them is BT-2987's job.
exclude = ["fuzz", "desktop/src-tauri"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
strip = "debuginfo"

[workspace.package]
# Keep in sync with VERSION file at repo root
version = "0.4.0"
authors = ["James Casey"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/jamesc/beamtalk"

[workspace.dependencies]
# Workspace crates
beamtalk-build = { path = "crates/beamtalk-build" }
# why: shared leaf for the Core Erlang Document/leaf/docvec! pretty-printing
# API (see docs/development/architecture-principles.md §6, ADR 0117 step 4)
beamtalk-cerl-doc = { path = "crates/beamtalk-cerl-doc" }
beamtalk-home = { path = "crates/beamtalk-home" }
# why: beamtalk-mcp's offline lint/diagnostic_summary tools share
# beamtalk-cli's manifest/build-layout/dependency-class-resolution logic
# (BT-2823) via this lib target.
beamtalk-cli = { path = "crates/beamtalk-cli" }
# why: ADR 0117 step 5 (BT-3362) — the Code Generation bounded context,
# extracted from beamtalk-core into its own crate; depends on beamtalk-core,
# never the reverse (see docs/development/architecture-principles.md §1).
beamtalk-codegen = { path = "crates/beamtalk-codegen" }
beamtalk-core = { path = "crates/beamtalk-core" }
beamtalk-desktop-broker = { path = "crates/beamtalk-desktop-broker" }
beamtalk-etf = { path = "crates/beamtalk-etf" }
beamtalk-examples = { path = "crates/beamtalk-examples" }
# why: ADR 0117 step 5 (BT-3361) — the Language Service bounded context,
# extracted from beamtalk-core into its own crate; depends on beamtalk-core,
# never the reverse (see docs/development/architecture-principles.md §1).
beamtalk-language-service = { path = "crates/beamtalk-language-service" }
beamtalk-lint = { path = "crates/beamtalk-lint" }
beamtalk-project = { path = "crates/beamtalk-project" }
beamtalk-repl = { path = "crates/beamtalk-repl" }
beamtalk-repl-protocol = { path = "crates/beamtalk-repl-protocol" }
beamtalk-sysroot = { path = "crates/beamtalk-sysroot" }
beamtalk-workspace = { path = "crates/beamtalk-workspace" }

# CLI
clap = { version = "4", features = ["derive"] }

# Strings and paths
ecow = "0.3"
camino = "1"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# Serialization (for snapshot tests)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# System directories
dirs = "6"

# Cryptography
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# File locking
fs2 = "0.4"

# Signal handling
ctrlc = "3"
libc = "0.2"
signal-hook = "0.4"

# Markdown rendering
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Line editing
rustyline = { version = "18", features = ["derive"] }

# LSP
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Stack safety
stacker = "0.1"

# WebSocket (ADR 0020 — REPL protocol transport)
tungstenite = "0.30"
tokio-tungstenite = "0.30"

# Windows process management (native replacement for sysinfo, BT-1039).
# Win32_System_Diagnostics_ToolHelp: process-tree enumeration, used only in
# beamtalk-desktop-broker's spawn.rs tests (BT-3046) to verify the winjob
# JobHandle kill-on-close actually reaps a spawned .bat's grandchild process,
# not just the immediate cmd.exe wrapper.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Diff generation (for beamtalk fmt-check unified diff output)
similar = "3"

# Testing
insta = { version = "1", features = ["yaml"] }
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow multiple versions from transitive dependencies
multiple_crate_versions = "allow"
# Restriction lints (opt-in for quality)
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
