[package]
name = "beamtalk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Same lint levels as the root `[workspace.lints]`. This crate is outside the
# workspace (see the comment above), so it cannot inherit them with
# `workspace = true`; `just check-lint-parity` (scripts/ci/check-lint-parity.py)
# fails if this table drifts from the root one.
[lints.rust]
missing_debug_implementations = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.beamtalk-core]
path = "../crates/beamtalk-core"
# why: compile_pipeline needs core_erlang_structural_issues from
# test_helpers::test_support (BT-3124) to share the same Core Erlang
# validity checks core_erlang_validity_tests.rs's proptest suite uses,
# instead of duplicating them in the fuzz crate.
features = ["test"]

# why: ADR 0117 step 5 (BT-3362) — compile_pipeline exercises the full
# pipeline (lex → parse → analyse → codegen); codegen now lives in its own
# crate.
[dependencies.beamtalk-codegen]
path = "../crates/beamtalk-codegen"

[[bin]]
name = "parse_arbitrary"
path = "fuzz_targets/parse_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile_pipeline"
path = "fuzz_targets/compile_pipeline.rs"
test = false
doc = false
bench = false
